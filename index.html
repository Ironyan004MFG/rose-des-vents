<style id="bb-style">
/* Layout: a parchment map of the Sword Coast on a dark guild board; each office opens its own notice board of pinned parchment quests. */
:root{
  --board:#0e1b20; --board-2:#14272d; --line:#2a434a;
  --parch:#ece3cb; --parch-2:#e2d6b6; --parch-3:#d9c9a0; --ink:#2a2219; --ink-soft:#5a4d3c;
  --sea:#c9c3a6; --land:#eadfbf;
  --gold:#d8b45e; --on-board:#f1e9d2; --on-board-muted:#a9bcb6;
  --open:#2f6d43; --progress:#8a5b12; --done:#5f564b;
  --r-cuivre:#b8733a; --r-fer:#7b8a93; --r-argent:#c3ccd2; --r-or:#d8b45e; --r-mithral:#86cfcb;
  --danger:#9b2c22;
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'EB Garamond', Garamond, Georgia, serif;
  color-scheme:dark;
}
body{background:var(--board);color:var(--on-board);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:26px}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header svg{flex:none}
.head-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{font-style:italic;color:var(--on-board-muted);font-size:18px}
.back{align-self:flex-start;font-family:var(--display);font-size:13px;letter-spacing:.1em;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:40px;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px}
.back:hover{border-color:var(--gold)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-size:13px;letter-spacing:.08em;background:transparent;color:var(--on-board-muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer}
.chip:hover{color:var(--on-board);border-color:var(--on-board-muted)}
.chip[aria-pressed="true"]{background:var(--gold);color:#1b1408;border-color:var(--gold)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:6px}
select,input,textarea{font:inherit;font-family:var(--body);text-transform:none;letter-spacing:normal;font-size:16px;color:var(--ink);background:#f7f1e1;border:1px solid #b9a982;border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
.bar select{background:var(--board-2);color:var(--on-board);border-color:var(--line);width:auto;font-family:var(--display);font-size:13px;letter-spacing:.06em;min-height:38px}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:24px;align-items:start}
.mapwrap{grid-template-areas:"map nav" "gaz nav";grid-template-rows:auto 1fr}
.mapwrap>.map{grid-area:map}
.mapwrap>.offices{grid-area:nav}
.mapwrap>.gazette{grid-area:gaz;margin-top:0}
.map{background:var(--parch-3);border-radius:6px;padding:10px;box-shadow:0 14px 30px rgba(0,0,0,.5);min-width:0}
.map svg{display:block;width:100%;height:auto}
.mk{cursor:pointer;outline:none}
.mk .mk-in{transition:transform .18s ease;transform-box:fill-box;transform-origin:center}
.mk:hover .mk-in,.mk:focus-visible .mk-in{transform:scale(1.14)}
.mk:focus-visible .ring{stroke:#1b1408;stroke-width:5}
.mk.zero{opacity:.72}
.offices{display:flex;flex-direction:column;gap:10px;min-width:0}
.offices h2{font-family:var(--display);font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.office{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--on-board);background:var(--board-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:48px;box-sizing:border-box}
.office:hover,.office:focus-visible{border-color:var(--gold);outline:none}
.office .nm{font-family:var(--display);font-size:15px;letter-spacing:.04em}
.office .tag{display:block;font-family:var(--body);font-style:italic;font-size:14px;color:var(--on-board-muted);letter-spacing:0}
.count{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;background:var(--parch);color:var(--ink);border-radius:4px;padding:4px 10px;font-size:14px;white-space:nowrap}
.count.zero{background:transparent;color:var(--on-board-muted);border:1px solid var(--line)}
.hint{color:var(--on-board-muted);font-size:15px;font-style:italic;margin:4px 0 0}
@media (max-width:860px){.mapwrap{grid-template-columns:1fr;grid-template-areas:"map" "nav" "gaz";grid-template-rows:auto}}

/* board */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px 22px;align-items:start}
.note{position:relative;background:var(--parch);color:var(--ink);border-radius:3px;padding:26px 22px 20px;box-shadow:0 10px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;min-width:0}
.note:nth-child(3n+1){transform:rotate(-.6deg)} .note:nth-child(3n+2){transform:rotate(.5deg)}
.note::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0d58c,#9b7424 70%);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.note.done{background:var(--parch-2);opacity:.82}
.note-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.seal{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.seal i{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
/* Rangs de Guilde : matériau de la plaque */
.gm-bois{--m1:#6e4628;--m2:#a8733f;--mi:#f3e2c6}.gm-cuivre{--m1:#8a4a22;--m2:#d08a52;--mi:#fff1e2}.gm-fer{--m1:#4e585e;--m2:#97a3aa;--mi:#f1f4f6}.gm-argent{--m1:#9aa5ab;--m2:#eef2f4;--mi:#2a3236}.gm-or{--m1:#a07a22;--m2:#f0d488;--mi:#3a2a08}.gm-mithral{--m1:#3f9893;--m2:#c9f2ef;--mi:#0f2e2c}.gm-rose{--m1:#23262f;--m2:#5d6678;--mi:#f1d48a}
.gplaque .gp-stars{color:#f1d48a;letter-spacing:.1em;text-shadow:0 1px 1px rgba(0,0,0,.5)}.gm-mithral .gp-stars{color:#0f2e2c;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.grankform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:6px 0}.grankform label{display:flex;flex-direction:column;font-size:13px}
.gchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px 2px 3px;border-radius:4px;background:linear-gradient(135deg,var(--m1),var(--m2) 60%,var(--m1));color:var(--mi);border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);vertical-align:middle;white-space:nowrap}
.gchip svg{width:14px;height:14px}
.gplaque{position:relative;display:flex;align-items:center;gap:14px;max-width:360px;margin:6px 0 4px;padding:12px 18px 12px 12px;border-radius:8px;background:linear-gradient(135deg,var(--m1),var(--m2) 55%,var(--m1));color:var(--mi);border:1px solid rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.25),inset 0 0 0 4px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.35)}
.gplaque.gm-bois{background:repeating-linear-gradient(100deg,rgba(0,0,0,.08) 0 3px,transparent 3px 11px),linear-gradient(135deg,var(--m1),var(--m2) 55%,var(--m1))}
.gplaque .gp-rose{width:46px;height:46px;flex:none;filter:drop-shadow(0 1px 0 rgba(255,255,255,.35)) drop-shadow(0 -1px 0 rgba(0,0,0,.3))}
.gplaque .gp-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.gplaque .gp-g{font-family:var(--display);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;line-height:1.3}
.gplaque .gp-name{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.15;overflow-wrap:anywhere;text-shadow:0 1px 0 rgba(255,255,255,.3),0 -1px 0 rgba(0,0,0,.35)}
.gplaque .gp-r{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.gplaque .gp-stamp{width:40px;height:40px;flex:none;transform:rotate(-14deg);opacity:.85}
.xpline{margin:4px 0 2px;font-size:15px}.xprow{display:flex;align-items:center;gap:10px;max-width:420px}.xpbar{flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.12);overflow:hidden}.xpnext{flex:none;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#b8862f,#e3c06c)}
.xpbox{margin:14px 0 6px;padding:10px 14px;border:1px solid var(--parch-3,#d9c9a0);border-radius:6px}.xpbox legend{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:0 6px}.xpbox label{display:inline-flex;flex-direction:column;max-width:240px}.xpbox ul{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}.xpbox li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}.xpbox li .xpp{flex-direction:row;align-items:center;gap:6px;font-size:14px}.xpbox li .xpp input{width:90px}
.xphist{list-style:none;margin:6px 0;padding:0;max-width:560px;font-size:15px}.xphist li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.1)}.xphist .d{flex:none;width:92px;color:var(--ink-soft);font-size:13.5px;font-variant-numeric:tabular-nums}.xphist .t{flex:1;min-width:0}.xphist .x{flex:none;font-weight:700;font-variant-numeric:tabular-nums}.xphist .bp{display:block;font-size:13px;color:var(--ink-soft)}.xpline .nx{color:var(--ink-soft);font-size:14px}
.ecmode{overflow:hidden}.ectv{position:fixed;inset:0;background:#000;z-index:100;cursor:none}.ectv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ectv-info{position:absolute;left:50%;bottom:2vh;transform:translateX(-50%);max-width:70vw;pointer-events:none}.ectv-info p{margin:0;padding:10px 22px;background:rgba(14,22,26,.82);color:#f6ecd0;border:1px solid rgba(216,180,94,.6);border-radius:8px;font-family:var(--display);font-size:clamp(16px,1.6vw,30px);text-align:center;letter-spacing:.03em}
.ectv-ord{position:absolute;top:2vh;right:1.5vw;pointer-events:none}.ectv-ord h3{margin:0 0 4px;color:#d8b45e;font-family:var(--display);font-size:clamp(13px,1vw,20px);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 3px #000}
.ectv-ord ol{margin:0;padding:8px 14px 8px 30px;background:rgba(14,22,26,.78);border-radius:8px;color:#e9dfc6;font-size:clamp(14px,1.2vw,24px)}.ectv-ord li{padding:2px 0}.ectv-ord li.cur{color:#ffd877;font-weight:700}.ectv-ord li.cur::marker{content:"▸ "}
.ectv-met{position:absolute;top:2vh;left:1.5vw;max-width:34vw;padding:8px 14px;background:rgba(14,22,26,.78);border-radius:8px;color:#e9dfc6;pointer-events:none;font-size:clamp(12px,1vw,20px)}.ectv-met:empty{display:none}.ectv-met strong{display:block;color:#d8b45e;font-family:var(--display);letter-spacing:.06em}
.calparch{position:absolute;top:10px;left:10px;z-index:3;display:flex;flex-direction:column;align-items:center;padding:6px 14px 7px;background:linear-gradient(180deg,#efe0b6,#e3cf9a);color:#3a2a17;border-radius:3px 3px 10px 10px/3px 3px 6px 6px;box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 0 0 1px rgba(90,60,20,.35);font-family:var(--display);pointer-events:none;line-height:1.2}
.calparch::before,.calparch::after{content:"";position:absolute;left:-4px;right:-4px;height:6px;background:#c9b07a;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.3)}.calparch::before{top:-3px}.calparch::after{bottom:-3px}
.calparch .cd{font-size:13px;font-weight:700;letter-spacing:.04em;white-space:nowrap}.calparch .cs{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.map{position:relative}.map.saison-hiver svg{filter:saturate(.7) brightness(1.06)}.map.saison-automne svg{filter:sepia(.18) saturate(1.1)}.map.saison-ete svg{filter:saturate(1.08)}
.ecdm .ecdate{font-size:13.5px;padding:0 4px}.ecdays{background:#efe4c6;border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14px}.ecdays .ecdl{margin:4px 0 0;padding-left:20px}.ecdays .ecdl li.cur{font-weight:700}.ecdays .ecdl li.trj{font-style:italic;color:#6b5a44}.ecdays.sc{margin-top:0}
.calform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:6px 0}.calform label{display:flex;flex-direction:column;font-size:13px}.calform input{max-width:110px}
.ectv-met .dt{display:block;font-family:var(--display);font-size:.9em;letter-spacing:.05em;color:#e9dfc6;margin-bottom:2px}
.ecdm .chip.here{border-color:#d8b45e;border-width:2px}.ecdm .ecday{font-family:var(--display);font-size:13px;letter-spacing:.08em;padding:0 4px}.ecdm .ecmet{background:#efe4c6;border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14px}.ecdm .ecmet ul{margin:4px 0 0;padding-left:18px}.ecdm .ecmet p{margin:4px 0 0}
.ectv-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#d8b45e;font-family:var(--display);font-size:22px;text-align:center;padding:20px;pointer-events:none}.ectv-msg:empty{display:none}
.ecdm .ecbar,.ecdm .ecrow,.ecdm .ecsel{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:8px 0}.ecdm label{display:flex;flex-direction:column;font-size:13px}.ecdm label.ecck{flex-direction:row;align-items:center;gap:5px}.ecdm .ecsp{flex:1}
.ectvbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin:0 0 10px;border:1px solid rgba(216,180,94,.35);border-radius:8px;background:rgba(216,180,94,.08)}.ecshown{color:#9fd59a;font-weight:600}.eccat summary{cursor:pointer;font-weight:600;margin:6px 0}
.ecdm .eccanvas{background:#0e161a;border-radius:8px;overflow:hidden;line-height:0}.ecdm canvas#ec-dm{width:100%;display:block;touch-action:none;cursor:crosshair;max-height:72vh;object-fit:contain}

.cart{margin:8px 0 6px;padding:10px 14px;border:1px solid rgba(216,180,94,.5);border-radius:8px;background:rgba(216,180,94,.08);max-width:760px}.cart>summary{cursor:pointer;font-size:16px}.cart.empty{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14.5px}.cart .desc{color:var(--on-board-muted)}
.cartl{list-style:none;margin:8px 0;padding:0}.cartl li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(246,236,208,.15);font-size:14.5px}.cartl .cn{flex:1;min-width:0}.cartl .cq{white-space:nowrap}.cartl .cp{white-space:nowrap;font-variant-numeric:tabular-nums;min-width:70px;text-align:right}

function reportBox(q){
  if((q.statut!=="encours"&&q.statut!=="terminee")||ui.dm||!myConfirmed(q))return "";
  const grp=signupsFor(q.id).filter(s=>s.statut==="confirmee"&&s.uid&&s.uid!=="dm"&&s.id===q.id+"__"+s.uid),w=grp.find(s=>s.uid===q.redacteur);

function signupsFor(id){return inscriptions.filter(s=>s.quete===id).sort((a,b)=>(a.creeMs||0)-(b.creeMs||0));}
function openCount(id){return quetes.filter(q=>q.bureau===id&&q.statut==="ouverte").length;}
function charge(q){
  const s=signupsFor(q.id), conf=s.filter(x=>x.statut==="confirmee").length, pend=s.filter(x=>x.statut==="attente").length;
  const max=q.joueursMax;
  if(q.supercharged||(max!=null&&conf>max))return {level:"super",conf,pend,max};
  if(max!=null&&conf+pend>max)return {level:"risque",conf,pend,max};
  return {level:"",conf,pend,max};
}

function rose(size,center){
  const s=size/104;let h='<g transform="scale('+s+')">';
  [45,135,225,315].forEach(a=>{h+='<polygon transform="rotate('+a+')" points="0,-62 -9,-9 0,0 9,-9" fill="#d8b45e" opacity=".75"></polygon>';});
  [0,90,180,270].forEach(a=>{h+='<g transform="rotate('+a+')"><polygon points="0,-104 -15,-15 0,0" fill="#d8b45e"></polygon><polygon points="0,-104 15,-15 0,0" fill="#f6ecd0"></polygon></g>';});
  return h+'<circle r="9" fill="'+center+'" stroke="#d8b45e" stroke-width="4"></circle></g>';
}
function errText(e){
  const c=(e&&e.code)||"";
  if(c.indexOf("permission-denied")>=0)return "Action refusée par les règles de sécurité.";
  if(c.indexOf("unavailable")>=0)return "Connexion perdue. Réessaie dans un instant.";
  if(c.indexOf("popup-closed")>=0||c.indexOf("cancelled-popup")>=0)return "Connexion annulée.";
  if(c.indexOf("unauthorized-domain")>=0)return "Ce site n'est pas autorisé dans Firebase (domaines autorisés).";
  if(c.indexOf("operation-not-allowed")>=0)return "Ce mode de connexion n'est pas activé dans Firebase.";
  return (e&&e.message)?e.message:"Erreur inconnue.";
}
async function run(label, fn){
  save={state:"saving",msg:label};render();
  try{await fn();save={state:"saved",msg:"Sauvegardé"};render();return true;}
  catch(e){console.error(e);save={state:"error",msg:errText(e)};render();return false;}
}

/* ---------- auth ---------- */
onAuthStateChanged(auth, async u=>{
  user=u;isAdmin=false;adminChecked=false;
  if(u&&!u.isAnonymous){
    try{const a=await getDoc(doc(db,"admins",u.uid));isAdmin=a.exists();}catch(e){isAdmin=false;}
    adminChecked=true;
    listenPrivate(isAdmin);
    if(isAdmin){ui.dm=true;ui.authMsg="";}
    else if(ui.loginIntent==="dm")ui.authMsg='Ce compte Google n\'est pas administrateur. Pour l\'ajouter, crée dans Firestore le document admins/'+u.uid+'.';
    if(!isAdmin){let asked=false;try{asked=sessionStorage.getItem("rdv-prompt-"+u.uid)==="1";}catch(e){}if(!asked)ui.promptSheet=true;}
    if(ui.needLogin&&!isAdmin){ui.signup=ui.needLogin;ui.promptSheet=false;}
    ui.needLogin=null;ui.loginIntent=null;
  }
  if(!isAdmin){ui.dm=false;listenPrivate(false);}
  render();
});
getRedirectResult(auth).catch(e=>{ui.authMsg=errText(e);render();});

function signupList(q){
  const list=signupsFor(q.id).filter(s=>ui.dm||s.statut!=="refusee");
  if(!list.length)return "<em>Personne encore</em>";
  return '<span class="names">'+list.map(s=>{
    const mine=user&&s.uid===user.uid&&s.statut!=="refusee"&&q.statut==="ouverte";
    const sa=s.aventurier&&aventuriers.find(a=>a.id===s.aventurier);
    let h='<span class="name st-'+esc(s.statut)+'">'+(sa?'<a class="plink" href="#perso-'+esc(s.aventurier)+'">'+esc(s.nom)+'</a> '+gChip(sa):esc(s.nom));
    if(s.statut==="attente")h+=' <em>(en attente)</em>';

/* ---------- planification (outil facultatif) ---------- */
const DISPO=["oui","peut","non"],DISPO_SYM={oui:"✓",peut:"?",non:"✗"},DISPO_LBL={oui:"Disponible",peut:"Peut-être",non:"Pas disponible"};
function todayIso(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function planDates(qid){const t=todayIso();return planifs.filter(p=>p.quete===qid&&p.date>=t).sort((a,b)=>(a.date+(a.heure||"")).localeCompare(b.date+(b.heure||"")));}
function fmtPlan(p){const d=new Date(p.date+"T12:00:00");return d.toLocaleDateString("fr-CA",{weekday:"short",day:"numeric",month:"short"})+(p.heure?", "+p.heure:"");}
function planRows(q){const seen={};return signupsFor(q.id).filter(s=>s.statut!=="refusee"&&s.uid&&s.uid.indexOf("dm-")!==0&&!seen[s.uid]&&(seen[s.uid]=1));}
function planScore(p,rows){let n=0;rows.forEach(r=>{const v=(p.dispo||{})[r.uid];if(v==="oui")n+=1;else if(v==="peut")n+=0.5;});return n;}
function planBest(q){const rows=planRows(q);let best=null,bs=0;planDates(q.id).forEach(p=>{if(p.dm==="non")return;const sc=planScore(p,rows);if(sc>bs){bs=sc;best=p;}});return best;}
function canPlan(q){return q.statut==="ouverte"&&(ui.dm||!!(user&&!user.isAnonymous&&signupsFor(q.id).some(s=>s.uid===user.uid&&s.statut!=="refusee")));}
function planLine(q){
  if(q.statut!=="ouverte")return "";const ds=planDates(q.id);if(!ds.length&&!canPlan(q))return "";
  const best=planBest(q),rows=planRows(q);
  const yes=best?rows.filter(r=>(best.dispo||{})[r.uid]==="oui").length:0;
  return '<p class="planline"><button class="mini plan" data-a="plan" data-id="'+esc(q.id)+'">📅 Planification</button>'+
    (best?'<span>Meilleure date : <strong>'+esc(fmtPlan(best))+'</strong> ('+yes+'/'+rows.length+')</span>':ds.length?'<span>'+ds.length+' date'+(ds.length>1?'s':'')+' proposée'+(ds.length>1?'s':'')+'</span>':'<span class="muted">Facultatif : proposez des dates</span>')+'</p>';
}
function planModal(q){

  else{
    h+='<div class="tablewrap"><table class="plantable"><thead><tr><th scope="col">Aventurier</th>'+ds.map(p=>{const del=open&&(ui.dm||(p.par&&p.par.uid===me));

    h+='<tr class="dmrow"><th scope="row">Le DM</th>'+ds.map(p=>cell(p,null,true)).join("")+'</tr>';

    h+='<tr class="tot"><th scope="row">Total</th>'+ds.map(p=>{const y=rows.filter(r=>(p.dispo||{})[r.uid]==="oui").length,m=rows.filter(r=>(p.dispo||{})[r.uid]==="peut").length;return '<td>'+y+' ✓'+(m?' · '+m+' ?':'')+'</td>';}).join("")+'</tr></tbody></table></div>';
  }

function resizeImage(file,maxSize){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=()=>rej(new Error("Lecture impossible"));
    r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("Image illisible"));im.onload=()=>{
      const max=maxSize||360,sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.82));};im.src=r.result;};
    r.readAsDataURL(file);
  });
}

function fmtDate(t){return t&&t.toDate?t.toDate().toLocaleDateString("fr-CA",{day:"numeric",month:"short",year:"numeric"}):"";}
function plainExcerpt(t){return String(t||"").replace(/[#*_>`|\[\]()-]/g," ").replace(/\s+/g," ").trim().slice(0,140);}

/* ---------- évolution du monde ---------- */
const NOTE_CATS = ["Intrigues","PNJ","Secrets","Idées de quêtes","Factions","Lieux"];
const RANK_ORDER = ["cuivre","fer","argent","or","mithral"];
function nextRank(r){const i=RANK_ORDER.indexOf(r);return i<0?"cuivre":RANK_ORDER[Math.min(i+1,RANK_ORDER.length-1)];}
function seuilMonde(){const v=monde&&monde.seuil;return typeof v==="number"&&v>0?v:3;}
function doneIn(bid){return quetes.filter(q=>q.bureau===bid&&q.rapport&&(q.statut==="terminee"||q.statut==="archivee"));}
function pendingIn(bid){const r=(monde&&monde.regions&&monde.regions[bid])||{},vues=r.vues||[];return doneIn(bid).filter(q=>vues.indexOf(q.id)<0);}
function dueRegions(){return bureaux.filter(b=>pendingIn(b.id).length>=seuilMonde());}
// Âge d'une quête ouverte = missions accomplies depuis sa publication (ou sa dernière évolution) : 1 dans sa région, ½ ailleurs.
function ageMax(){const v=monde&&monde.ageMax;return typeof v==="number"&&v>0?v:4;}
function aggravSeuil(){const v=monde&&monde.aggravSeuil;return typeof v==="number"&&v>0?v:2;}
function ageBase(q){return Math.max(tms(q.creeLe)||0,((monde&&monde.reset)||{})[q.id]||0);}
function ageOf(q){const F=(monde&&monde.fini)||{},b=ageBase(q);let a=0;Object.keys(F).forEach(k=>{const e=F[k];if(k!==q.id&&e&&e.ms>b)a+=e.r===q.bureau?1:0.5;});return a;}
function agedIn(bid){return quetes.filter(q=>q.statut==="ouverte"&&(!bid||q.bureau===bid)&&ageOf(q)>=ageMax());}
function aggravIn(bid){const r=(monde&&monde.regions&&monde.regions[bid])||{},A=r.aggrav||{},c=r.criseMs||0;return Object.keys(A).filter(k=>A[k]>c).length;}
function criseRegions(){return bureaux.filter(b=>aggravIn(b.id)>=aggravSeuil());}
// Sens d'une évolution de région : positive s'il n'y a eu aucune aggravation depuis la dernière évolution, sinon mitigée.
function regionSens(bid){return aggravIn(bid)===0?"positif":"mixte";}
function carteSeuil(){const v=monde&&monde.carteSeuil;return typeof v==="number"&&v>0?v:2;}
function carteCount(){const c=(monde&&monde.carteMs)||0,l=evols.filter(e=>e.region!=="carte"&&tms(e.date)>c);return {pos:l.filter(e=>e.sens==="positif").length,neg:l.filter(e=>e.sens==="negatif").length};}
function carteDue(){const k=carteCount(),n=carteSeuil();return k.neg>=n?"negatif":(k.pos>=n&&k.neg===0?"positif":null);}
const SENS_L={positif:"positive",mixte:"mitigée",negatif:"crise"};
function newsFor(bid){return nouvelles.filter(n=>!bid||n.region===bid||(bid&&n.region==="cote")).sort((a,b)=>tms(b.date)-tms(a.date));}
function tms(t){return t&&t.toMillis?t.toMillis():0;}
function newsChars(n){const l=(n.aventuriers||[]).map(id=>aventuriers.find(a=>a.id===id)).filter(Boolean);
  return l.length?'<p class="nchars">'+l.map(a=>'<a class="nchar" href="#perso-'+esc(a.id)+'">'+(a.image?'<img src="'+esc(a.image)+'" alt="">':'')+esc(a.nom)+'</a>').join("")+'</p>':'';}
function newsArticle(n){return '<article class="newsitem"><div class="ntop"><span class="creg">'+esc(regionName(n.region))+'</span><span class="jd">'+esc(fmtDate(n.date))+'</span></div><h3>'+esc(n.titre)+'</h3><div class="wikibody">'+md(n.contenu)+'</div>'+newsChars(n)+'</article>';}
function newsList(list){return '<div class="news">'+list.map(newsArticle).join("")+'</div>';}
function gazette(){const l=nouvelles.slice().sort((a,b)=>tms(b.date)-tms(a.date));if(!l.length&&!isAdmin)return "";
  const lim=ui.gazAll?l:l.slice(0,5);

    (l.length?'<div class="gzcols">'+lim.map((n,i)=>'<article class="gzart'+(i===0?' lead':'')+'"><div class="ntop"><span class="creg">'+esc(regionName(n.region))+'</span><span class="jd">'+esc(fmtDate(n.date))+'</span></div><h3>'+esc(n.titre)+'</h3><div class="wikibody">'+md(n.contenu)+'</div>'+newsChars(n)+'</article>').join("")+'</div>'+

// Brouillon d'article « crieur public » à partir d'un rapport de mission (le DM le retouche avant de publier).
function draftFromQuest(q){const r=q.rapport||{},b=office(q.bureau),parts=(r.participants||[]);
  const names=parts.map(x=>x.nom),who=names.length>1?names.slice(0,-1).join(", ")+" et "+names[names.length-1]:(names[0]||"des aventuriers de la Guilde");

  const corps={reussite:who+" de la Grande Guilde de la Rose des Vents ont mené à bien la mission « "+q.titre+" »"+lieu+".",partielle:who+" sont revenus de la mission « "+q.titre+" »"+lieu+", mais tout ne s'est pas passé comme prévu.",echec:who+" ont échoué dans la mission « "+q.titre+" »"+lieu+"."}[r.resultat]||who+" ont accompli la mission « "+q.titre+" ».";
  const titre={reussite:"Exploit à "+(b?b.nom:"la côte")+" : "+q.titre,partielle:"Demi-victoire à "+(b?b.nom:"la côte")+" : "+q.titre,echec:"Revers à "+(b?b.nom:"la côte")+" : "+q.titre}[r.resultat]||q.titre;
  return {titre:titre.slice(0,120),region:q.bureau,quete:q.id,aventuriers:parts.map(x=>x.aventurier).filter(Boolean),
    contenu:(intro+corps+(r.resume?"\n\nSelon les témoins : *"+r.resume+"*":"")+"\n\nQue l'on se le dise !").slice(0,5000)};}
function newsForm(n){n=n||{titre:"",contenu:"",region:"cote",aventuriers:[]};

    '<fieldset class="wide pick"><legend>Aventuriers mentionnés (l\'article apparaît sur leur fiche)</legend>'+charPicker("nwc",n.aventuriers)+'</fieldset>'+
    '<div class="actions wide"><button class="btn gold" type="submit">Publier</button><button class="btn ghost" type="button" data-a="news-cancel">Annuler</button></div></form>';}
function boardNews(bid){if(!nouvelles.length)return "";const l=nouvelles.filter(n=>n.region===bid).sort((a,b)=>tms(b.date)-tms(a.date)).slice(0,3);

async function reveal(kind,id){

function modPas(){const v=monde&&monde.modPas;return typeof v==="number"&&v>0?v:3;}
function modParse(m){const t=String(m.etapes||""),parts=t.split(/\n(?=##\s)/).map(x=>x.trim()).filter(x=>/^##\s/.test(x));
  const st=[],fins={};parts.forEach(x=>{const h=x.split("\n")[0].replace(/^##\s*/,"").trim(),body=x.split("\n").slice(1).join("\n").trim(),f=h.toLowerCase().match(/^fin\s+(positive|normale|n[ée]gative)/);
    if(f)fins[f[1].startsWith("n")&&f[1]!=="normale"?"negative":f[1]]={titre:h,txt:body};else st.push({titre:h,txt:body});});return {etapes:st,fins:fins};}
function modActive(m){return m.statut==="premices"||m.statut==="encours";}
function modMissions(m){const F=(monde&&monde.fini)||{},b=m.etapeMs||m.debutMs||0;return Object.keys(F).filter(k=>F[k]&&F[k].ms>b).length;}
function modEtape(m){return typeof m.etape==="number"?m.etape:0;}
function modDue(m){if(!modActive(m))return null;const n=modParse(m).etapes.length;if(!n)return null;return modMissions(m)>=modPas()?(modEtape(m)+1>=n?"fin":"etape"):null;}
function modBalance(m){const R=m.regions||[],all=R.indexOf("cote")>=0,b=m.debutMs||0;return evols.filter(e=>e.region!=="carte"&&(all||R.indexOf(e.region)>=0)&&tms(e.date)>b).reduce((t,e)=>t+(e.sens==="positif"?1:e.sens==="negatif"?-1:0),0);}
function modFinOf(bal){return bal>0?"positive":bal<0?"negative":"normale";}
function modGauge(bal){const c=Math.max(-3,Math.min(3,bal));return '<span class="modbal" title="Balance : '+(bal>0?'+':'')+bal+'">'+[-3,-2,-1,0,1,2,3].map(i=>'<i class="'+(i===c?'on ':'')+(i<0?'neg':i>0?'pos':'zero')+'"></i>').join("")+'</span>';}
function modProg(m){const P=modParse(m),n=P.etapes.length,e=modEtape(m),left=Math.max(0,modPas()-modMissions(m));
  return n?'<span class="modprog">Étape '+Math.min(e+1,n)+' / '+n+(modActive(m)?(left?' · prochaine dans '+left+' mission'+(left>1?'s':''):' · étape suivante due'):'')+'</span>':'<span class="desc">Étapes à écrire</span>';}
function modsIn(bid,active){return modOrder().filter(m=>((m.regions||[]).indexOf(bid)>=0||(m.regions||[]).indexOf("cote")>=0)&&(!active||m.statut==="premices"||m.statut==="encours"));}
function modQuests(m){return quetes.filter(q=>(scenarios[q.id]||{}).module===m.id);}
function factionByName(n){const k=String(n||"").trim().toLowerCase();return factions.find(f=>String(f.nom).toLowerCase()===k);}
function factionMembers(f){const k=String(f.nom).trim().toLowerCase();return byName(pnjs).filter(p=>String(p.faction||"").split(",").some(x=>x.trim().toLowerCase()===k));}
function factionChips(p){return String(p.faction||"").split(",").map(f=>f.trim()).filter(f=>f&&!/^aucune/i.test(f)).map(f=>{const F=factionByName(f);return F&&isAdmin?'<a class="ccat" href="#man/factions/'+encodeURIComponent(F.id)+'">'+esc(f)+'</a>':'<span class="ccat">'+esc(f)+'</span>';}).join("")+(p.outerworlder?'<span class="ccat ow">Outerworlder</span>':'');}

function genEncounter(){const G=ui.gen,bi={faible:0,moderee:1,elevee:2}[G.diff],budget=budgets()[bi],floor=bi>0?budgets()[bi-1]:Math.round(budget*0.5);
  let c=monstres.filter(m=>crXp(m.fp)>0&&crXp(m.fp)<=budget&&(!G.region||m.region===G.region||!m.region||m.region==="cote")&&(!G.type||String((m.type||"")+" "+(m.tags||"")).toLowerCase().indexOf(G.type.toLowerCase())>=0));
  if(!c.length)return {err:"Aucun monstre du bestiaire ne correspond (ou tous dépassent le budget de "+budget+" XP)."};
  let best=null;
  for(let t=0;t<80;t++){const pool=c.slice().sort(()=>Math.random()-.5),k=1+Math.floor(Math.random()*Math.min(3,pool.length));let total=0,count=0;const g=[];
    for(let i=0;i<k;i++){const m=pool[i],x=crXp(m.fp),max=Math.min(Math.floor((budget-total)/x),i===0?6:3,8-count);if(max<1)continue;const n=1+Math.floor(Math.random()*max);g.push({id:m.id,nb:n});total+=n*x;count+=n;}
    let grew=true;while(grew&&count<8){grew=false;for(const r of g){const x=crXp((monstres.find(m=>m.id===r.id)||{}).fp);if(total+x<=budget&&count<8&&Math.random()<.6){r.nb++;total+=x;count++;grew=true;}}}

const ART_STYLE="Style : illustration officielle d'un manuel de Donjons & Dragons. Peinture numérique réaliste et très détaillée, proportions réalistes (pas de dessin animé ni de manga), textures riches (tissus, cuir, métal), lumière chaude et douce venant du haut à gauche. Fond de parchemin TRÈS CLAIR (beige pâle) uni, légèrement taché, avec un vignettage doux ; aucun décor. Sujet seul, centré, représenté EN PIED de la tête aux pieds, légère contre-plongée, pose naturelle et expressive, petite ombre douce au sol. Format vertical 4:5. Aucun texte, aucune signature, aucun cadre, aucun logo.";
const ART_INSTR="Tu es l'illustrateur du manuel de la « Grande Guilde de la Rose des Vents », une campagne de Donjons & Dragons 5e édition (règles 2024) qui se déroule sur la Sword Coast, dans les Royaumes oubliés.\n\nÀ chaque message, je te donne une fiche (PNJ, créature, lieu ou faction). Tu génères UNE seule image qui respecte toujours exactement ce style, pour que toutes les images aient l'air de sortir du même livre :\n\n"+ART_STYLE+"\n\nRègles :\n- Garde la même esthétique que l'image de référence (le portrait de Pax, le giff en manteau rouge qui tient une tasse de café) : même rendu peint, même fond de parchemin, même lumière, même cadrage en pied.\n- Crée toujours des designs originaux : ne reproduis jamais une illustration officielle existante ni un personnage connu.\n- Respecte la description (espèce, âge, vêtements, accessoires). Si un détail manque, invente-le de façon cohérente avec le rôle du personnage et la Sword Coast.\n- Les « Outerworlders » sont des gens de notre monde arrivés SANS RIEN dans ce monde de fantasy. Ils vivent en appliquant ce qu'ils connaissent de la vie moderne, mais avec des moyens et des matériaux médiévaux : leurs vêtements et leurs objets peuvent s'inspirer du monde moderne (coupe, idée, usage), mais ils sont toujours fabriqués à la main en bois, cuir, tissu, fer forgé, laiton ou verre soufflé. Jamais de plastique, d'électronique, de logo ni de vraie technologie moderne.\n- Les naines n'ont PAS de barbe, sauf si la fiche le précise explicitement.\n- La rose des vents (étoile à 8 branches) est l'emblème de la Guilde : ne la mets JAMAIS sur un personnage, sauf si sa fiche dit qu'il porte l'emblème de la Guilde. N'ajoute aucun autre symbole, blason ou emblème inventé : seulement ceux décrits dans la fiche. Le portrait de Pax sert uniquement de référence de style (rendu, fond, lumière, cadrage), pas de costume.\n- Varie les poses d'une image à l'autre : orientation du corps (de face, de trois quarts à gauche ou à droite, de profil), direction du regard, gestes, appui et attitude propres au personnage. Évite que tous les personnages se tiennent dans la même pose. Varie aussi les palettes de couleurs selon le rôle et la faction, sans jamais t'écarter de la description.\n- Pour une créature : même fond et même rendu, créature entière, pose menaçante ou naturelle, sans personnage autour.\n- Pour un lieu ou une faction : une illustration en vignette sur le même fond de parchemin (un emblème, un bâtiment ou une scène), sans texte.\n- Ne me pose pas de questions : génère directement l'image.";
const ATT_PROMPT={amical:"bienveillant et accueillant",neutre:"neutre, réservé",mefiant:"méfiant, sur ses gardes",hostile:"menaçant, hostile",inconnu:"énigmatique"};

function ptDamage(c,n,quiet){

  if(c.tmp>0){const t=Math.min(c.tmp,rest);c.tmp-=t;rest-=t;}
  c.pv=Math.max(0,c.pv-rest);const atk=ui.ptAtk&&ui.ptAtk.to===c.cid?ptC(ui.ptAtk.from):null;if(!quiet)ptLog((atk?atk.nom+" inflige "+n+" dégâts à "+c.nom:c.nom+" subit "+n+" dégâts")+" ("+c.pv+"/"+c.pvMax+" PV).");if(atk)ui.ptAtk=null;

      if(before===0){c.ds=c.ds||{s:0,f:0};c.ds.f=Math.min(3,c.ds.f+1);al.push(c.nom+" subit des dégâts à 0 PV : un échec au jet contre la mort (deux si coup critique).");}

  }
  if(al.length)ui.ptAlert=al.join(" ");
}

function ptRoll(expr){

  while((m=re.exec(s))){ok=true;
    if(m[3]){const n=Math.min(50,+(m[2]||1)),f=+m[3],sg=m[1]==="-"?-1:1;
      if(ui.ptAdv){const r1=[],r2=[];for(let i=0;i<n;i++){r1.push(ptD(f));r2.push(ptD(f));}const s1=r1.reduce((x,y)=>x+y,0),s2=r2.reduce((x,y)=>x+y,0),v=ui.ptAdv==="adv"?Math.max(s1,s2):Math.min(s1,s2);total+=sg*v;

  ["pp","po","pa","pc"].forEach(k=>{const n=Math.floor(c*(m[k]||0)/(V[k]*100));r[k]=n;});r.pc=Math.min(r.pc,m.cpc||300);r.pa=Math.min(r.pa,m.cpa||300);let used=r.pp*1000+r.po*100+r.pa*10+r.pc;c-=used;
  r.po+=Math.floor(c/100);c%=100;r.pa+=Math.floor(c/10);r.pc+=c%10;return r;}
function coinsTxt(r){return [["pp","pp"],["po","po"],["pa","pa"],["pc","pc"]].filter(x=>r[x[0]]).map(x=>r[x[0]].toLocaleString("fr-CA")+" "+x[1]).join(", ")||"rien";}
function shopRate(S){return S.type==="fourgue"?0.4:0.5;}
function shopPrice(S,it){return shopRound(it.prix*(1+(S.mod||0)));}

  if(o){h+='<p class="shopoffer">'+o.txt+'</p>'+(o.offre>0?'<button class="btn gold sm" data-a="pt-shop-sold" data-id="'+esc(S.id)+'">Accepter ('+fmtPo(o.offre,S.lieu==="cite")+')</button>':'')+'<button class="btn ghost sm" data-a="pt-shop-nooffer" data-id="'+esc(S.id)+'">Refuser</button>';}
  h+='</div>';
  if((S.log||[]).length)h+='<details class="shoplog"><summary>Transactions ('+S.log.length+')</summary><ul>'+S.log.slice().reverse().map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></details>';

async function shopAction(a,id,b,v,q){const P=ui.pt;P.boutiques=P.boutiques||[];const S=P.boutiques.find(x=>x.id===id);
  if(a==="pt-shop-gen"){const lieu=ui.shopLieu||"ville";const types=Object.keys(SHOP_TYPES).filter(k=>SHOP_TYPES[k].lx.indexOf(lieu)>=0);const ty=types.indexOf(v)>=0?v:types[0];
    P.boutiques.forEach(x=>{x.ouvert=false;});const s=shopGen(ty,lieu,q.bureau);P.boutiques.push(s);ptLog("Boutique : "+s.nom+" ("+SHOP_TYPES[ty].l+", "+SHOP_LIEUX[lieu].l.toLowerCase()+").");return true;}
  if(a==="pt-shop-house"){const t=String((document.getElementById("sh-house")||{}).value||"").slice(0,20000);await run("Objets maison",()=>setDoc(doc(db,"prive","boutiques"),{maison:t},{merge:true}));shopCfg=Object.assign({},shopCfg||{},{maison:t});return false;}
  if(!S)return false;
  if(a==="pt-shop-mod"){S.mod=+v||0;return true;}
  if(a==="pt-shop-buy"){const it=S.inv[+v];if(!it||it.stock===0)return false;const p=shopPrice(S,it);if(it.stock!=null)it.stock--;S.fonds=shopRound(S.fonds+p);S.log.push("Vendu : "+it.nom+" pour "+fmtPo(p,S.lieu==="cite"));ptLog(S.nom+" : vendu "+it.nom+" ("+fmtPo(p,S.lieu==="cite")+").");return true;}
  if(a==="pt-shop-offer"){const nom=String((document.getElementById("sv-n-"+id)||{}).value||"").trim().slice(0,80)||"Objet",val=Math.max(0,+(document.getElementById("sv-v-"+id)||{}).value||0);
    const juste=shopRound(val*shopRate(S)*(1-(S.mod||0)));let offre=juste,txt;
    if(!val){ui.shopSell={id,nom,val,offre:0,txt:"Indique la valeur de l'objet."};return false;}
    if(juste>S.cap&&juste>S.fonds)offre=Math.min(S.cap,S.fonds);else if(juste>S.cap)offre=S.cap;else if(juste>S.fonds)offre=S.fonds;
    offre=shopRound(offre);
    const pay=offre>0?' <span class="coins">Payé en '+coinsTxt(coinsOf(offre,S.mix||SHOP_MIX[S.lieu]))+'.</span>':'';
    txt=offre<=0?"« Désolé, je n'ai plus un sou en caisse. »":offre<juste?"Prix juste : "+fmtPo(juste,S.lieu==="cite")+". « Je n'ai pas cette somme. Je peux vous en donner <strong>"+fmtPo(offre,S.lieu==="cite")+"</strong>, pas un cuivre de plus. »":"« Je vous en donne <strong>"+fmtPo(offre,S.lieu==="cite")+"</strong>. »";
    ui.shopSell={id,nom,val,offre,txt:txt+pay};return false;}
  if(a==="pt-shop-nooffer"){ui.shopSell=null;return false;}
  if(a==="pt-shop-sold"){const o=ui.shopSell;if(!o||o.id!==id||!(o.offre>0))return false;S.fonds=shopRound(S.fonds-o.offre);S.inv.push({nom:o.nom,prix:shopRound(o.val),base:o.val,stock:1,rachat:true});
    S.log.push("Acheté au groupe : "+o.nom+" pour "+fmtPo(o.offre,S.lieu==="cite"));ptLog(S.nom+" : achète "+o.nom+" au groupe ("+fmtPo(o.offre,S.lieu==="cite")+").");ui.shopSell=null;return true;}
  if(a==="pt-shop-regen"){const n=shopGen(S.type,S.lieu,S.region);S.inv=n.inv.concat(S.inv.filter(x=>x.rachat));return true;}
  if(a==="pt-shop-del"){P.boutiques=P.boutiques.filter(x=>x.id!==id);return true;}
  if(a==="pt-shop-pnj"){const T=SHOP_TYPES[S.type]||{};await run("PNJ",()=>setDoc(doc(collection(db,"pnj")),{nom:S.marchand,role:"Marchand : "+S.nom+" ("+(T.l||"")+")",espece:S.espece,voix:S.trait,lieu:S.nom,region:S.region||"",attitude:"neutre",quetes:[q.id],notes:"Créé depuis une boutique de session ("+(SHOP_LIEUX[S.lieu]||{}).l+")."}));
    S.log.push("Marchand gardé comme PNJ dans le Manuel.");return true;}
  return false;}

function geoCimetiere(c,R){const W=c.w,H=c.h,x0=3,y0=3,x1=W-3,y1=H-3,g={box:{x0,y0,x1,y1},graves:[],trees:[],lights:[],dead:[]};g.gate={x:Math.floor(W/2)-1,y:y1};
  g.maus={x:W/2-4,y:y0+2,w:8,h:6};for(let y=y0+10;y<y1-2;y+=3)for(let x=x0+2;x<x1-2;x+=2.4){if(Math.abs(x+0.5-W/2)<2)continue;if(R()<0.85)g.graves.push({x:x+R()*0.3,y:y+R()*0.3,k:R()<0.15?"croix":R()<0.2?"dalle":"stele",tilt:(R()-0.5)*0.25});}
  for(let k=0;k<Math.round(W*H/180);k++)g.dead.push({x:x0+R()*(x1-x0),y:y0+R()*(y1-y0),s:Math.floor(R()*1e6)});
  for(let k=0;k<W*H/30;k++){const x=R()*W,y=R()*H;if(x>x0-1&&x<x1+1&&y>y0-1&&y<y1+1)continue;g.trees.push({x,y,r:1.2+R()*1.4,c:Math.floor(R()*4),ph:R()*6});}g.trees.sort((a,b)=>a.y-b.y);g.lights.push({x:g.maus.x+g.maus.w/2,y:g.maus.y+g.maus.h+0.6,r:2,nuit:1});return g;}
function statCimetiere(x,g,s,c){const R=ecRng(ecSeed(c.seed+"o"));ecGround(x,c,s,R,true);ecTreeShadows(x,g.trees,s);const b=g.box;
  x.fillStyle="#9a9384";x.fillRect((g.gate.x)*s,(b.y0+8)*s,2*s,(c.h-b.y0-8)*s);
  g.graves.forEach(gr=>{x.save();x.translate(gr.x*s,gr.y*s);x.rotate(gr.tilt);x.fillStyle="rgba(0,0,0,.3)";x.fillRect(0.12*s,0.15*s,1.2*s,2*s);x.fillStyle="#5a4a3a";x.fillRect(0.1*s,0.5*s,1*s,1.6*s);x.fillStyle=gr.k==="dalle"?"#a8a294":"#8d877a";
    if(gr.k==="croix"){x.fillRect(0.5*s,0,0.2*s,0.8*s);x.fillRect(0.25*s,0.2*s,0.7*s,0.18*s);}else if(gr.k==="dalle")x.fillRect(0.05*s,0.4*s,1.1*s,1.8*s);else{x.beginPath();x.moveTo(0.15*s,0.5*s);x.lineTo(0.15*s,0.15*s);x.quadraticCurveTo(0.6*s,-0.15*s,1.05*s,0.15*s);x.lineTo(1.05*s,0.5*s);x.closePath();x.fill();}x.restore();});
  const m=g.maus;x.fillStyle="rgba(0,0,0,.35)";x.fillRect((m.x+0.4)*s,(m.y+0.5)*s,m.w*s,m.h*s);x.fillStyle="#8d877a";x.fillRect(m.x*s,m.y*s,m.w*s,m.h*s);x.fillStyle="#a8a294";x.fillRect(m.x*s,m.y*s,m.w*s,m.h*s/2);x.strokeStyle="rgba(0,0,0,.35)";x.strokeRect(m.x*s,m.y*s,m.w*s,m.h*s);
  [0.6,m.w-0.6].forEach(dx=>{gCirc(x,m.x+dx,m.y+m.h+0.3,0.35,s,"#b8b2a4","#6e685c");});x.fillStyle="#3a2a17";x.fillRect((m.x+m.w/2-0.7)*s,(m.y+m.h-0.2)*s,1.4*s,0.3*s);
  g.dead.forEach(d=>{const RR=ecRng(d.s);x.strokeStyle="#4a433a";x.lineWidth=Math.max(1,s*0.12);for(let i=0;i<6;i++){const a=RR()*6.28,l=0.8+RR()*1.4;x.beginPath();x.moveTo(d.x*s,d.y*s);x.lineTo((d.x+Math.cos(a)*l)*s,(d.y+Math.sin(a)*l)*s);x.stroke();}x.fillStyle="#3a342c";x.beginPath();x.arc(d.x*s,d.y*s,0.3*s,0,6.283);x.fill();});
  x.strokeStyle="#6e685c";x.lineWidth=Math.max(2,s*0.35);x.beginPath();x.moveTo(b.x0*s,b.y0*s);x.lineTo(b.x1*s,b.y0*s);x.lineTo(b.x1*s,b.y1*s);x.lineTo((g.gate.x+2)*s,b.y1*s);x.moveTo(g.gate.x*s,b.y1*s);x.lineTo(b.x0*s,b.y1*s);x.lineTo(b.x0*s,b.y0*s);x.stroke();
  x.strokeStyle="#2b2b2b";x.lineWidth=Math.max(1,s*0.08);x.beginPath();x.moveTo(g.gate.x*s,b.y1*s);x.lineTo((g.gate.x+0.9)*s,(b.y1+0.6)*s);x.moveTo((g.gate.x+2)*s,b.y1*s);x.lineTo((g.gate.x+1.1)*s,(b.y1+0.6)*s);x.stroke();}
function dynCimetiere(x,g,s,t,dt,A,c){const TT=Date.now()/1000;(A.wisp=A.wisp||Array.from({length:Math.round(c.w*c.h/90)},()=>({x:Math.random()*c.w,y:Math.random()*c.h,r:2+Math.random()*3,v:0.1+Math.random()*0.2,p:Math.random()*6}))).forEach(m=>{const X=((m.x+TT*m.v)%(c.w+8))-4,Y=m.y+Math.sin(TT*0.2+m.p)*0.6,gr=x.createRadialGradient(X*s,Y*s,0,X*s,Y*s,m.r*s);gr.addColorStop(0,"rgba(220,225,230,.22)");gr.addColorStop(1,"rgba(220,225,230,0)");x.fillStyle=gr;x.fillRect((X-m.r)*s,(Y-m.r)*s,m.r*2*s,m.r*2*s);});
  const TP=ecTreePal();g.trees.forEach(tr=>ecTreeOne(x,tr,s,TT,A.wind,TP));
  A.cn=(A.cn==null?4:A.cn)-dt;if(A.cn<=0){A.cn=9+Math.random()*12;A.crows=(A.crows||[]).concat([{x:-2,y:Math.random()*c.h,v:3.4,p:Math.random()*6}]);}A.crows=(A.crows||[]).filter(b=>{b.x+=b.v*dt;if(b.x>c.w+3)return false;const f=Math.sin(t*9+b.p);x.strokeStyle="#151515";x.lineWidth=Math.max(1.5,s*0.08);x.beginPath();x.moveTo((b.x-0.4)*s,(b.y-0.15*f)*s);x.lineTo(b.x*s,b.y*s);x.lineTo((b.x+0.4)*s,(b.y-0.15*f)*s);x.stroke();return true;});}

function geoRuines(c,R){const W=c.w,H=c.h,g={walls:[],cols:[],rubble:[],trees:[],lights:[],statue:null,floor:[]};const x0=Math.floor(W*0.2),y0=Math.floor(H*0.2),x1=Math.floor(W*0.8),y1=Math.floor(H*0.8);
  g.floor.push({x0,y0,x1,y1});const seg=(ax,ay,bx,by)=>{const L=Math.hypot(bx-ax,by-ay);for(let u=0;u<L;){const l=2+R()*5,gap=R()<0.55?1+R()*3:0;g.walls.push({x0:ax+(bx-ax)*u/L,y0:ay+(by-ay)*u/L,x1:ax+(bx-ax)*Math.min(L,u+l)/L,y1:ay+(by-ay)*Math.min(L,u+l)/L,h:R()});u+=l+gap;}};
  seg(x0,y0,x1,y0);seg(x1,y0,x1,y1);seg(x1,y1,x0,y1);seg(x0,y1,x0,y0);const mx=Math.floor((x0+x1)/2);seg(mx,y0,mx,y0+(y1-y0)*0.6);seg(x0,Math.floor((y0+y1)/2),mx-3,Math.floor((y0+y1)/2));
  for(let x=mx+3;x<x1-1;x+=3){g.cols.push({x,y:y0+3,up:R()<0.6,a:R()*3});g.cols.push({x,y:y1-3,up:R()<0.6,a:R()*3});}
  for(let k=0;k<W*H/40;k++)g.rubble.push({x:x0-3+R()*(x1-x0+6),y:y0-3+R()*(y1-y0+6)});g.statue={x:(mx+x1)/2,y:(y0+y1)/2};
  for(let k=0;k<W*H/45;k++){const x=R()*W,y=R()*H,inside=x>x0&&x<x1&&y>y0&&y<y1;if(inside&&R()<0.8)continue;if(!g.trees.some(t=>Math.hypot(t.x-x,t.y-y)<t.r))g.trees.push({x,y,r:1+R()*1.8,c:Math.floor(R()*4),ph:R()*6});}g.trees.sort((a,b)=>a.y-b.y);return g;}
function statRuines(x,g,s,c){const R=ecRng(ecSeed(c.seed+"o"));ecGround(x,c,s,R);ecTreeShadows(x,g.trees,s);g.floor.forEach(f=>{for(let X=f.x0;X<f.x1;X++)for(let Y=f.y0;Y<f.y1;Y++){if(R()<0.25)continue;x.fillStyle=["#8d877a","#837d70","#7a7468"][(X+Y*3)%3];x.fillRect(X*s,Y*s,s-1,s-1);}});
  g.rubble.forEach(o=>gFurn(x,Object.assign({k:"rubble"},o),s));
  g.walls.forEach(w=>{x.strokeStyle="rgba(0,0,0,.3)";x.lineWidth=0.9*s;x.lineCap="square";x.beginPath();x.moveTo((w.x0+0.2)*s,(w.y0+0.3)*s);x.lineTo((w.x1+0.2)*s,(w.y1+0.3)*s);x.stroke();x.strokeStyle=w.h>0.5?"#6e685c":"#7d776a";x.beginPath();x.moveTo(w.x0*s,w.y0*s);x.lineTo(w.x1*s,w.y1*s);x.stroke();x.strokeStyle="rgba(255,255,255,.12)";x.lineWidth=0.25*s;x.beginPath();x.moveTo(w.x0*s,(w.y0-0.25)*s);x.lineTo(w.x1*s,(w.y1-0.25)*s);x.stroke();
    x.strokeStyle="rgba(70,110,50,.7)";x.lineWidth=Math.max(1,s*0.12);x.beginPath();x.moveTo(w.x0*s,w.y0*s);x.quadraticCurveTo(((w.x0+w.x1)/2+0.3)*s,((w.y0+w.y1)/2+0.3)*s,w.x1*s,w.y1*s);x.stroke();});
  g.cols.forEach(o=>{if(o.up)gCirc(x,o.x,o.y,0.45,s,"#b8b2a4","#6e685c");else{x.save();x.translate(o.x*s,o.y*s);x.rotate(o.a);x.fillStyle="rgba(0,0,0,.3)";x.fillRect(-1.6*s+3,-0.4*s+3,3.2*s,0.8*s);x.fillStyle="#b8b2a4";x.fillRect(-1.6*s,-0.4*s,3.2*s,0.8*s);x.strokeStyle="rgba(0,0,0,.25)";for(let i=-1.2;i<1.6;i+=0.8){x.beginPath();x.moveTo(i*s,-0.4*s);x.lineTo(i*s,0.4*s);x.stroke();}x.restore();}});
  const st=g.statue;gRect(x,st.x-1,st.y-1,2,2,s,"#8d877a","#55524a");gCirc(x,st.x,st.y,0.55,s,"#a8a294","#6e685c");}
function dynRuines(x,g,s,t,dt,A,c){const TT=Date.now()/1000,TP=ecTreePal();g.trees.forEach(tr=>ecTreeOne(x,tr,s,TT,A.wind,TP));}

function burSurround(x,g,s,c,OT,SA){const W=c.w,H=c.h,R=ecRng(ecSeed(c.seed+"|abords|"+g.bid)),G=g.G,occ=new Uint8Array(W*H),dist=new Float32Array(W*H).fill(1e9),q=[];

    W.leaves.forEach(l=>{l.x+=l.v*dt;l.y+=Math.sin(t*3+l.p)*30*dt;if(l.x>cw+10){l.x=-10;l.y=Math.random()*ch;}x.save();x.translate(l.x,l.y);x.rotate(t*4+l.p);x.fillStyle=l.c;x.beginPath();x.ellipse(0,0,5,2.4,0,0,6.283);x.fill();x.restore();});}

/* ---------- Calendrier de Harptos (date de la campagne) ---------- */
// 12 mois de 30 jours + fêtes ; Bouclerencontre (Shieldmeet) les années divisibles par 4. La date avance avec les quêtes.
const HARPTOS=[["Hammer",30],["Mi-hiver",1,1],["Alturiak",30],["Ches",30],["Tarsakh",30],["Herbeverte",1,1],["Mirtul",30],["Kythorn",30],["Flamerule",30],["Mi-été",1,1],["Bouclerencontre",1,2],["Eleasis",30],["Eleint",30],["Hautes-Moissons",1,1],["Marpenoth",30],["Uktar",30],["Fête de la Lune",1,1],["Nightal",30]];
let calDoc=null;
function calLeap(an){return an%4===0;}
function calLen(an){return calLeap(an)?366:365;}
function calMult(){return Math.max(1,Math.min(30,+(calDoc&&calDoc.mult)||5));}
function calNow(){return calDoc&&calDoc.an?{an:+calDoc.an,j:+calDoc.j||1}:{an:1492,j:123};}
function calParts(an,j){let d=j;for(const m of HARPTOS){if(m[2]===2&&!calLeap(an))continue;if(d<=m[1])return {nom:m[0],jour:d,fete:!!m[2]};d-=m[1];}return {nom:"Nightal",jour:30,fete:false};}
function calDoy(an,nom,jour){let d=0;for(const m of HARPTOS){if(m[2]===2&&!calLeap(an))continue;if(m[0]===nom)return d+Math.min(jour||1,m[1]);d+=m[1];}return 1;}
// Saisons : équinoxe de printemps 19 Ches, solstice d'été 20 Kythorn, équinoxe d'automne 21 Eleint, solstice d'hiver 20 Nightal.
function calSaison(an,j){const sp=calDoy(an,"Ches",19),su=calDoy(an,"Kythorn",20),au=calDoy(an,"Eleint",21),wi=calDoy(an,"Nightal",20);return j>=wi||j<sp?"hiver":j<su?"printemps":j<au?"ete":"automne";}
function calLabel(c){const x=calParts(c.an,c.j);return (x.fete?x.nom:x.jour+" "+x.nom)+" "+c.an+" DR";}
function calAdd(c,n){let an=c.an,j=c.j+n;while(j>calLen(an)){j-=calLen(an);an++;}while(j<1){an--;j+=calLen(an);}return {an,j};}
function calParch(){const c=calNow(),sa=calSaison(c.an,c.j);return '<div class="calparch" title="Date de la campagne"><span class="cd">'+esc(calLabel(c))+'</span><span class="cs">'+esc(EC_SAISON[sa].l)+'</span></div>';}
function calForm(){const c=calNow(),x=calParts(c.an,c.j);
  return '<form class="calform" id="calform"><label for="cal-j">Jour<input id="cal-j" type="number" min="1" max="30" value="'+x.jour+'"></label><label for="cal-m">Mois ou fête<select id="cal-m">'+HARPTOS.filter(m=>m[2]!==2||calLeap(c.an)).map(m=>'<option'+(m[0]===x.nom?' selected':'')+'>'+esc(m[0])+'</option>').join("")+'</select></label><label for="cal-a">Année (DR)<input id="cal-a" type="number" min="1300" max="1600" value="'+c.an+'"></label><label for="cal-x">Temps hors mission (× jours de quête)<input id="cal-x" type="number" min="1" max="30" value="'+calMult()+'"></label><button class="mini gold" type="submit">Changer la date</button></form>';}
/* ---------- Déroulement d'un scénario en jours ---------- */
// Champ scenarios.jours : une ligne par jour « Titre | scènes | météo » (météo : auto, abri, ou une météo précise).
// Trajet depuis le bureau de la Guilde : « 1 » (1 jour aller, 1 jour retour) ou « 0/2 » (aller/retour).
function scTrajet(q){const t=String((scenarios[q.id]||{}).trajet||"").trim();if(!t)return {a:0,r:0};const m=t.split(/[\/|,]/).map(x=>Math.max(0,Math.min(30,parseInt(x)||0)));return {a:m[0],r:m.length>1?m[1]:m[0]};}
// Cartes des scènes du scénario : une ligne « Nom | type | heure | météo | taille | URL » (carte fixe : la graine vient de la quête et du nom).
function scMaps(q){const t=String((scenarios[q.id]||{}).cartes||"");return t.split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(x=>x[0]).map((x,i)=>{const tp=(x[1]||"route").toLowerCase(),sz=String(x[4]||"").match(/(\d+)\s*[x×]\s*(\d+)/);
  return {id:"sc"+i+"-"+ecSeed(x[0]).toString(36),nom:x[0],type:(EC_MAPS[tp]||tp==="chemin")?tp:"route",lum:EC_LUM[(x[2]||"").toLowerCase()]?(x[2]||"").toLowerCase():"jour",meteo:(x[3]||"clair").toLowerCase(),w:sz?Math.max(8,Math.min(120,+sz[1])):0,h:sz?Math.max(6,Math.min(120,+sz[2])):0,url:x[5]||"",seed:x[6]?"lieu|"+x[6].toLowerCase():q.id+"|"+x[0]};});}
function scDuree(q){const d=parseInt((scenarios[q.id]||{}).duree);return d>=0?d:1;}
// La saison globale ajuste une météo prédéfinie qui ne lui convient pas.
const EC_SEASONIZE={hiver:{pluie:"neige",orage:"neige",chaleur:"clair"},ete:{neige:"pluie",froid:"clair",brouillard:"brume"},printemps:{neige:"pluie",froid:"nuageux",chaleur:"clair"},automne:{neige:"pluie",froid:"vent",chaleur:"clair"}};
function ecSeasonize(k,sa){const ok=EC_OK[sa]||EC_OK.printemps;if(!EC_METEO[k])return "clair";if(ok.indexOf(k)>=0)return k;const m=(EC_SEASONIZE[sa]||{})[k];return m&&ok.indexOf(m)>=0?m:"clair";}

function download(name,text){

function exportJSON(){

function previewImport(obj){
  const list=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.quetes)?obj.quetes:null);
  if(!list)throw new Error("Le fichier doit contenir une liste « quetes ».");
  const del=(obj&&Array.isArray(obj.supprimer)?obj.supprimer:[]).filter(id=>questById(id));
  const add=[],upd=[],bad=[];let same=0;
  list.forEach(raw=>{
    if(!raw||!raw.titre||!office(raw.bureau)){bad.push(raw);return;}
    const id=String(raw.id||("q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6))).replace(/[^A-Za-z0-9_-]/g,"").slice(0,60);
    const q=normQuest(raw),cur=questById(id);
    if(!cur)add.push({id,q});
    else if(JSON.stringify(normQuest(cur))!==JSON.stringify(q))upd.push({id,q});
    else same++;
  });
  return {add,upd,del,same,bad};
}
async function applyImport(){
  const p=ui.importPreview;if(!p)return;
  await run("Import",async()=>{
    const ops=[];
    p.add.forEach(x=>ops.push(bt=>bt.set(doc(db,"quetes",x.id),Object.assign({},x.q,{creeLe:serverTimestamp(),majLe:serverTimestamp()}))));
    p.upd.forEach(x=>ops.push(bt=>bt.set(doc(db,"quetes",x.id),Object.assign({},x.q,{majLe:serverTimestamp()}),{merge:true})));
    p.del.forEach(id=>{ops.push(bt=>bt.delete(doc(db,"quetes",id)));signupsFor(id).forEach(s=>ops.push(bt=>bt.delete(doc(db,"inscriptions",s.id))));});
    for(let i=0;i<ops.length;i+=400){const bt=writeBatch(db);ops.slice(i,i+400).forEach(f=>f(bt));await bt.commit();}
  });
  ui.importPreview=null;render();
}
async function migrate(){
  const miss=seedMissing();
  await run("Migration",async()=>{
    const bt=writeBatch(db);
    miss.b.forEach((b,i)=>{const d={nom:b.nom,x:b.x,y:b.y,ordre:SEED.bureaux.findIndex(x=>x.id===b.id)};if(b.siege)d.siege=true;bt.set(doc(db,"bureaux",b.id),d);});
    await bt.commit();
    const bt2=writeBatch(db);
    miss.q.forEach(q=>{bt2.set(doc(db,"quetes",q.id),Object.assign(normQuest(q),{creeLe:serverTimestamp(),majLe:serverTimestamp()}));});
    await bt2.commit();
    const bt3=writeBatch(db);let n=0;
    miss.q.forEach(q=>(q.inscrits||[]).forEach((nom,i)=>{n++;bt3.set(doc(db,"inscriptions",q.id+"__dm-mig"+i),{quete:q.id,uid:"dm",nom:String(nom).slice(0,40),statut:"confirmee",creeLe:serverTimestamp()});}));
    if(n)await bt3.commit();
  });
}

function compFields(d){return {titre:d.titre,categorie:d.categorie,region:d.region,contenu:d.contenu||"",image:d.image||"",quete:d.quete||""};}
// Joueur : la sauvegarde devient une proposition en revue. DM : publication directe.
async function saveComp(id,data,isNew){
  const by=compBy(),ref=doc(db,"compendium",id),f=compFields(data);
  return run("Compendium",async()=>{
    if(ui.dm){
      const bt=writeBatch(db);
      if(isNew)bt.set(ref,Object.assign({},f,{publiee:true,masque:false,proposition:null,creePar:by,modifiePar:by,creeLe:serverTimestamp(),majLe:serverTimestamp()}));
      else bt.set(ref,Object.assign({},f,{publiee:true,proposition:null,modifiePar:by,majLe:serverTimestamp()}),{merge:true});
      bt.set(doc(collection(db,"compendium",id,"versions")),Object.assign({},f,{par:by,approbateurs:{},date:serverTimestamp()}));
      await bt.commit();return;
    }
    const prop=Object.assign({},f,{par:by,approbations:{},date:serverTimestamp()});
    if(isNew)await setDoc(ref,Object.assign({},f,{publiee:false,masque:false,proposition:prop,creePar:by,creeLe:serverTimestamp()}));
    else await updateDoc(ref,{proposition:prop});
  });
}
// Approbation : la 2e approbation (ou le DM) publie la proposition et l'inscrit dans l'historique.
async function approveComp(e,force){
  const by=compBy(),p=e.proposition,ref=doc(db,"compendium",e.id);
  const appr=Object.assign({},p.approbations||{});if(!force)appr[by.uid]=by.nom;
  const done=force||Object.keys(appr).length>=2;
  return run(done?"Publication":"Approbation",async()=>{
    if(!done){await updateDoc(ref,{["proposition.approbations."+by.uid]:by.nom});return;}
    const f=compFields(p),bt=writeBatch(db);
    bt.update(ref,Object.assign({},f,{publiee:true,proposition:null,modifiePar:p.par,majLe:serverTimestamp()}));
    bt.set(doc(collection(db,"compendium",e.id,"versions")),Object.assign({},f,{par:p.par,approbateurs:appr,date:serverTimestamp()},force?{parDM:true}:{}));
    await bt.commit();
  });
}
