<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Babillard de la Rose des Vents</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style id="bb-style">
/* Layout: a parchment map of the Sword Coast on a dark guild board; each office opens its own notice board of pinned parchment quests. */
:root{
  --board:#0e1b20; --board-2:#14272d; --line:#2a434a;
  --parch:#ece3cb; --parch-2:#e2d6b6; --parch-3:#d9c9a0; --ink:#2a2219; --ink-soft:#5a4d3c;
  --sea:#c9c3a6; --land:#eadfbf;
  --gold:#d8b45e; --on-board:#f1e9d2; --on-board-muted:#a9bcb6;
  --open:#2f6d43; --progress:#8a5b12; --done:#5f564b;
  --r-cuivre:#b8733a; --r-fer:#7b8a93; --r-argent:#c3ccd2; --r-or:#d8b45e; --r-mithral:#86cfcb;
  --danger:#9b2c22;
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'EB Garamond', Garamond, Georgia, serif;
  color-scheme:dark;
}
body{background:var(--board);color:var(--on-board);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:26px}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header svg{flex:none}
.head-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{font-style:italic;color:var(--on-board-muted);font-size:18px}
.back{align-self:flex-start;font-family:var(--display);font-size:13px;letter-spacing:.1em;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:40px;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px}
.back:hover{border-color:var(--gold)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-size:13px;letter-spacing:.08em;background:transparent;color:var(--on-board-muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer}
.chip:hover{color:var(--on-board);border-color:var(--on-board-muted)}
.chip[aria-pressed="true"]{background:var(--gold);color:#1b1408;border-color:var(--gold)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:6px}
select,input,textarea{font:inherit;font-family:var(--body);text-transform:none;letter-spacing:normal;font-size:16px;color:var(--ink);background:#f7f1e1;border:1px solid #b9a982;border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
.bar select{background:var(--board-2);color:var(--on-board);border-color:var(--line);width:auto;font-family:var(--display);font-size:13px;letter-spacing:.06em;min-height:38px}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:24px;align-items:start}
.map{background:var(--parch-3);border-radius:6px;padding:10px;box-shadow:0 14px 30px rgba(0,0,0,.5);min-width:0}
.map svg{display:block;width:100%;height:auto}
.mk{cursor:pointer;outline:none}
.mk .mk-in{transition:transform .18s ease;transform-box:fill-box;transform-origin:center}
.mk:hover .mk-in,.mk:focus-visible .mk-in{transform:scale(1.14)}
.mk:focus-visible .ring{stroke:#1b1408;stroke-width:5}
.mk.zero{opacity:.72}
.offices{display:flex;flex-direction:column;gap:10px;min-width:0}
.offices h2{font-family:var(--display);font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.office{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--on-board);background:var(--board-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:48px;box-sizing:border-box}
.office:hover,.office:focus-visible{border-color:var(--gold);outline:none}
.office .nm{font-family:var(--display);font-size:15px;letter-spacing:.04em}
.office .tag{display:block;font-family:var(--body);font-style:italic;font-size:14px;color:var(--on-board-muted);letter-spacing:0}
.count{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;background:var(--parch);color:var(--ink);border-radius:4px;padding:4px 10px;font-size:14px;white-space:nowrap}
.count.zero{background:transparent;color:var(--on-board-muted);border:1px solid var(--line)}
.hint{color:var(--on-board-muted);font-size:15px;font-style:italic;margin:4px 0 0}
@media (max-width:860px){.mapwrap{grid-template-columns:1fr}}

/* board */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px 22px;align-items:start}
.note{position:relative;background:var(--parch);color:var(--ink);border-radius:3px;padding:26px 22px 20px;box-shadow:0 10px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;min-width:0}
.note:nth-child(3n+1){transform:rotate(-.6deg)} .note:nth-child(3n+2){transform:rotate(.5deg)}
.note::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0d58c,#9b7424 70%);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.note.done{background:var(--parch-2);opacity:.82}
.note-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.seal{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.seal i{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.kind{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.note h2{font-family:var(--display);font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
.desc{margin:0;white-space:pre-line}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:15.5px;border-top:1px dashed #b9a982;padding-top:10px}
.facts dt{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);padding-top:3px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stamp{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:2px solid currentColor;border-radius:4px;padding:3px 7px;transform:rotate(3deg);white-space:nowrap}
.st-ouverte{color:var(--open)} .st-encours{color:var(--progress)} .st-terminee{color:var(--done)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{font-family:var(--display);font-size:13px;letter-spacing:.08em;border-radius:6px;padding:9px 14px;min-height:40px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--parch)}
.btn:hover{background:#000}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(0,0,0,.06)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1408}
.btn.gold:hover{background:#e6c675}
.btn.board{background:transparent;color:var(--on-board);border-color:var(--line)}
.btn.board:hover{border-color:var(--on-board-muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.copybox{background:#f7f1e1;border:1px dashed #b9a982;border-radius:6px;padding:10px;font-size:15px;user-select:all}
.toast{font-size:15px;color:var(--open);font-style:italic}
.empty{grid-column:1/-1;text-align:center;color:var(--on-board-muted);font-style:italic;padding:40px 0}
.dmbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--board-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.dmbar .msg{flex:1 1 220px;color:var(--on-board-muted);font-size:15px;min-width:0}
.form{grid-column:1/-1;background:var(--parch);color:var(--ink);border-radius:4px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form h2{grid-column:1/-1;font-family:var(--display);margin:0;font-size:20px}
.form label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.form .wide{grid-column:1/-1}
.form textarea{min-height:110px;resize:vertical}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--on-board-muted);font-size:15px}
.legend .seal{color:var(--on-board-muted)}
footer{color:var(--on-board-muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.linkbtn{background:none;border:none;color:var(--on-board-muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;padding:6px 0;min-height:32px}
.linkbtn:hover{color:var(--on-board)}
@media (max-width:520px){.note{transform:none!important}.facts{grid-template-columns:1fr}.facts dt{padding-top:6px}}
.names{display:flex;flex-wrap:wrap;gap:4px 10px}
.name{display:inline-flex;align-items:center;gap:4px}
.name em{color:var(--ink-soft);font-size:14px}
.rm{border:1px solid #b9a982;background:transparent;color:var(--danger);border-radius:50%;width:26px;height:26px;line-height:1;font-size:16px;cursor:pointer;padding:0}
.rm:hover{background:rgba(155,44,34,.1)}
.modal-bg{position:fixed;inset:0;background:rgba(5,10,12,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--parch);color:var(--ink);border-radius:6px;padding:24px;max-width:440px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.modal h2{font-family:var(--display);font-size:20px;margin:0;text-wrap:balance}
.modal p{margin:0;font-size:15.5px;color:var(--ink-soft)}
.modal label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.mk .mk-in{transition:none}}

/* wiki */
.wiki{display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.wiki{grid-template-columns:1fr}}
.wikinav{background:var(--board-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.wikinav h2{font-family:var(--display);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
.wikinav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.wikinav a{display:block;color:var(--on-board);text-decoration:none;padding:8px 10px;border-radius:6px}
.wikinav a:hover{background:rgba(216,180,94,.08)}
.wikinav a[aria-current="page"]{background:var(--gold);color:#1b1408}
.wikipage{background:var(--parch);color:var(--ink);border-radius:4px;padding:26px clamp(18px,4vw,40px);box-shadow:0 10px 24px rgba(0,0,0,.45);min-width:0}
.wikititle{font-family:var(--display);font-size:clamp(24px,3.4vw,32px);margin:0 0 12px;text-wrap:balance}
.wikibody{max-width:70ch;font-size:17.5px;line-height:1.6}
.wikibody h2,.wikibody h3{font-family:var(--display);margin:1.4em 0 .4em;line-height:1.2}
.wikibody h2{font-size:22px}.wikibody h3{font-size:18px}
.wikibody p{margin:.6em 0}.wikibody ul,.wikibody ol{padding-left:1.4em}
.wikibody a{color:#7a4f00}
.wikibody blockquote{margin:1em 0;padding:.4em 1em;border-left:3px solid #b9a982;color:var(--ink-soft);font-style:italic}
.wikibody table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;margin:1em 0}
.wikibody th,.wikibody td{border:1px solid #c9b88f;padding:6px 10px;text-align:left}
.wikibody th{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--parch-2)}
.wikiform{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:14px}
.wikiform label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.wikiform .wide{grid-column:1/-1}
.wikiform textarea{min-height:360px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;line-height:1.5;resize:vertical}
.wikiform .tip{font-family:var(--body);text-transform:none;letter-spacing:0;font-style:italic;font-size:13px}
.wikiform .preview{border:1px dashed #b9a982;border-radius:6px;padding:12px 16px;background:#f7f1e1}
@media (max-width:560px){.wikiform{grid-template-columns:1fr}}
/* renommée */
.rn{display:inline-block;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:4px 10px;white-space:nowrap;border:1px solid transparent}
.rn0{background:#e2d6b6;color:#4d4030}
.rnp1{background:#efe2bb;color:#4a3a14}.rnp2{background:#ead39a;color:#3f300d}.rnp3{background:#e3c172;color:#33270a}
.rnp4{background:#d8ab4c;color:#2a1f06}.rnp5{background:#c99327;color:#1c1404}.rnp6{background:#f6ecd0;color:#7a4f00;border-color:#c99327;box-shadow:0 0 0 2px #c99327 inset}
.rnm1{background:#ead0c3;color:#5e2a1c}.rnm2{background:#d9927d;color:#3f130a}.rnm3{background:#9b2c22;color:#fff3ee}
.reg,.rep{display:flex;flex-direction:column;gap:12px}
.reg h2,.rep h2{font-family:var(--display);font-size:20px;letter-spacing:.08em;color:var(--gold);margin:0}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--board-2)}
.tablebox table{border-collapse:collapse;width:100%;min-width:560px}
.tablebox th,.tablebox td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:15.5px}
.tablebox thead th{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-board-muted);white-space:nowrap}
.tablebox td.num{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--on-board-muted);width:60px}
.roster th[scope=row]{font-family:var(--display);font-size:15px;white-space:nowrap}
.roster .pl{display:block;font-family:var(--body);font-style:italic;font-size:13px;color:var(--on-board-muted)}
.roster select{width:auto;min-width:130px;font-size:14px;padding:6px 8px}
.muted{color:var(--on-board-muted);font-style:italic;font-size:14px}
.replist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.replist li{display:grid;grid-template-columns:minmax(120px,auto) auto 1fr;gap:6px 14px;align-items:center;background:var(--board-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.replist .who{font-family:var(--display)} .replist .who em{font-family:var(--body);color:var(--on-board-muted);font-size:14px}
.replist .eff{color:var(--on-board-muted);font-size:15px;min-width:0}
@media (max-width:620px){.replist li{grid-template-columns:1fr}}
.rep a,.reg a{color:var(--gold)}
.office.regl{border-color:var(--gold)}
.scaleform{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:56px minmax(140px,1fr) minmax(0,3fr);gap:10px;align-items:end}
.srow label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-board-muted)}
.srow .rn{text-align:center;align-self:center}
@media (max-width:620px){.srow{grid-template-columns:1fr}}
.inline.dark label{color:var(--on-board-muted)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* firebase additions */
header .pill{margin-left:auto}
.pill{font-family:var(--body);font-size:14px;color:var(--on-board-muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:normal;max-width:100%}
.pill.good{color:#8fd1a3}.pill.warn{color:#e8c46a}.pill.bad{color:#f0a79e;border-color:#6b2a24}
.stamps{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.stamp.st-archivee{color:var(--done)}
.stamp.st-super{color:#b33a1c;transform:rotate(-2deg)}
.note.super{box-shadow:0 0 0 3px #e0572a,0 10px 24px rgba(0,0,0,.45)}
.superline{margin:0;font-style:italic;color:#9b2c22;font-weight:600}
.riskline{margin:0;font-style:italic;color:#8a5b12}
.rm.ok{color:var(--open)}
.mini{font-family:var(--body);font-size:14px;background:transparent;border:1px solid #b9a982;border-radius:999px;color:var(--danger);padding:2px 10px;min-height:28px;cursor:pointer;margin-left:4px}
.name.st-refusee{text-decoration:line-through;opacity:.7}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.inline label{flex:1 1 180px;display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.filebtn{position:relative;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.form .check{flex-direction:row;align-items:center;gap:8px;align-self:end;min-height:40px}
.form .check input{width:auto}
.toast.err{color:var(--danger)}
.dmbar.import{border-color:var(--gold)}
</style>
</head>

<script type="module">

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function parsePlayers(s){const n=String(s||"").match(/\d+/g);if(!n)return {min:null,max:null};const a=n.map(Number);return {min:a[0],max:a.length>1?a[a.length-1]:(/\+/.test(s)?null:a[0])};}
function normQuest(q){
  const out={};QUEST_KEYS.forEach(k=>{if(q[k]!==undefined)out[k]=q[k];});
  ["type","lieu","recompense","niveau","joueurs","date","description"].forEach(k=>{out[k]=String(out[k]==null?"":out[k]);});
  if(out.joueursMin===undefined||out.joueursMax===undefined){const p=parsePlayers(out.joueurs);if(out.joueursMin===undefined)out.joueursMin=p.min;if(out.joueursMax===undefined)out.joueursMax=p.max;}

  out.supercharged=!!out.supercharged;

  if(!RANKS[out.rang])out.rang="inconnu";
  if(!STATUS[out.statut])out.statut="ouverte";
  return out;
}
function office(id){return bureaux.filter(b=>b.id===id)[0];}

function signupsFor(id){return inscriptions.filter(s=>s.quete===id).sort((a,b)=>(a.creeMs||0)-(b.creeMs||0));}
function openCount(id){return quetes.filter(q=>q.bureau===id&&q.statut==="ouverte").length;}
function charge(q){
  const s=signupsFor(q.id), conf=s.filter(x=>x.statut==="confirmee").length, pend=s.filter(x=>x.statut==="attente").length;
  const max=q.joueursMax;
  if(q.supercharged||(max!=null&&conf>max))return {level:"super",conf,pend,max};

  return {level:"",conf,pend,max};
}
function rankSeal(r){const k=RANKS[r]||RANKS.inconnu;return '<span class="seal"><i style="background:'+k.c+'"></i>'+esc(k.label)+'</span>';}
function rose(size,center){
  const s=size/104;let h='<g transform="scale('+s+')">';

  return h+'<circle r="9" fill="'+center+'" stroke="#d8b45e" stroke-width="4"></circle></g>';
}
function errText(e){
  const c=(e&&e.code)||"";
  if(c.indexOf("permission-denied")>=0)return "Action refusée par les règles de sécurité.";
  if(c.indexOf("unavailable")>=0)return "Connexion perdue. Réessaie dans un instant.";
  if(c.indexOf("popup-closed")>=0||c.indexOf("cancelled-popup")>=0)return "Connexion annulée.";
  if(c.indexOf("unauthorized-domain")>=0)return "Ce site n'est pas autorisé dans Firebase (domaines autorisés).";
  if(c.indexOf("operation-not-allowed")>=0)return "Ce mode de connexion n'est pas activé dans Firebase.";
  return (e&&e.message)?e.message:"Erreur inconnue.";
}

    if((e.code||"").indexOf("popup-blocked")>=0){await signInWithRedirect(auth,p);return;}
    ui.authMsg=errText(e);render();
  }
}

/* ---------- renommée ---------- */
function scaleList(){const l=scaleDoc&&Array.isArray(scaleDoc.niveaux)&&scaleDoc.niveaux.length?scaleDoc.niveaux:DEFAULT_SCALE;return l.slice().sort((a,b)=>a.n-b.n);}
function lvl(n){return scaleList().find(s=>s.n===n)||{n,titre:String(n),effet:""};}
function rnClass(n){return "rn rn"+(n<0?"m"+(-n):n>0?"p"+n:"0");}
function chip(n){return '<span class="'+rnClass(n)+'">'+esc(lvl(n).titre)+'</span>';}
function seuilOf(s){return typeof s.seuil==="number"?s.seuil:((DEFAULT_SCALE.find(d=>d.n===s.n)||{seuil:0}).seuil);}
function rankPts(){return Object.assign({},DEFAULT_RANK_PTS,(scaleDoc&&scaleDoc.pointsParRang)||{});}
function questPts(q){return q.pointsRenommee!=null?q.pointsRenommee:(rankPts()[q.rang]||0);}
function hasPts(a,bid){return !!(a.points&&typeof a.points[bid]==="number");}
function pts(a,bid){
  if(hasPts(a,bid))return a.points[bid];
  const lv=a.renommee&&a.renommee[bid];
  if(typeof lv==="number"&&lv!==0){const s=scaleList().find(x=>x.n===lv);return s?seuilOf(s):0;}
  return 0;
}
function levelOf(p){let n=0;scaleList().forEach(s=>{const t=seuilOf(s);if(s.n>0&&p>=t&&s.n>n)n=s.n;if(s.n<0&&p<=t&&s.n<n)n=s.n;});return n;}
function renown(a,bid){return levelOf(pts(a,bid));}
function nextInfo(p){const lv=levelOf(p);const nx=scaleList().filter(s=>s.n>Math.max(lv,0)).sort((a,b)=>a.n-b.n)[0];return nx?{need:seuilOf(nx)-p,titre:nx.titre}:null;}
function ptsLabel(p){return (p>0?"+":"")+p+" pt"+(Math.abs(p)>1?"s":"");}
function addPoints(bt,a,bid,delta){
  const ref=doc(db,"aventuriers",a.id);
  if(hasPts(a,bid)||!(a.renommee&&a.renommee[bid]))bt.update(ref,new FieldPath("points",bid),increment(delta),"majLe",serverTimestamp());
  else bt.update(ref,new FieldPath("points",bid),pts(a,bid)+delta,"majLe",serverTimestamp());
}
function reputationSection(bid,nom){
  const list=aventuriers.filter(a=>pts(a,bid)!==0).sort((x,y)=>pts(y,bid)-pts(x,bid));
  let h='<section class="rep" aria-label="Réputation"><h2>Réputation à '+esc(nom)+'</h2>';
  if(!list.length)return h+'<p class="hint">Aucun aventurier ne s\'est encore fait un nom ici. <a href="#renommee">Voir le registre de renommée</a></p></section>';
  h+='<ul class="replist">'+list.map(a=>{const n=renown(a,bid),p=pts(a,bid);return '<li><span class="who">'+esc(a.nom)+(a.joueur?' <em>('+esc(a.joueur)+')</em>':'')+'<span class="pts">'+ptsLabel(p)+'</span></span>'+chip(n)+'<span class="eff">'+esc(lvl(n).effet)+'</span></li>';}).join("")+'</ul>';
  return h+'<p class="hint"><a href="#renommee">Voir le registre de renommée complet</a></p></section>';
}

  const sc=scaleList();
  let h='<section class="reg"><h2>L\'échelle de renommée</h2><p class="hint">La renommée se compte par région : un héros à Daggerford peut être un parfait inconnu à Luskan.</p>';
  if(ui.dm&&ui.scaleEdit){
    h+='<form id="scaleform" class="scaleform">'+sc.map(s=>'<div class="srow"><span class="'+rnClass(s.n)+'">'+(s.n>0?'+':'')+s.n+'</span><label for="sc-t'+s.n+'">Titre<input id="sc-t'+s.n+'" maxlength="40" value="'+esc(s.titre)+'"></label><label for="sc-e'+s.n+'">Comment les gens réagissent<input id="sc-e'+s.n+'" maxlength="300" value="'+esc(s.effet)+'"></label></div>').join("")+
      '<div class="actions"><button class="btn gold" type="submit">Enregistrer l\'échelle</button><button class="btn board" type="button" data-a="scale-cancel">Annuler</button></div></form>';
  } else {
    h+='<div class="tablebox"><table class="scale"><thead><tr><th scope="col">Niveau</th><th scope="col">Titre</th><th scope="col">Comment les gens réagissent</th></tr></thead><tbody>'+
      sc.slice().reverse().map(s=>'<tr><td class="num">'+(s.n>0?'+':'')+s.n+'</td><td>'+chip(s.n)+'</td><td>'+esc(s.effet)+'</td></tr>').join("")+'</tbody></table></div>';
    if(ui.dm)h+='<div class="actions"><button class="btn board" data-a="scale-edit">Modifier l\'échelle</button></div>';
  }
  h+='</section><section class="reg"><h2>Les aventuriers</h2>';
  if(ui.dm){
    h+=ui.advForm?'<form class="inline dark" id="advform"><label for="f-advnom">Nom du personnage<input id="f-advnom" required maxlength="60"></label><label for="f-advjoueur">Joueur<input id="f-advjoueur" maxlength="60"></label><button class="btn gold" type="submit">Ajouter au registre</button><button class="btn board" type="button" data-a="adv-cancel">Annuler</button></form>'
      :'<div class="actions"><button class="btn gold" data-a="adv-new">Ajouter un aventurier</button></div>';

/* ---------- actions ---------- */
function download(name,text){
  const blob=new Blob([text],{type:"application/json"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportJSON(){
  const data={format:"rose-des-vents",version:1,exporteLe:new Date().toISOString(),
    bureaux:bureaux.map(b=>Object.assign({},b)),
    quetes:quetes.map(q=>Object.assign({id:q.id},normQuest(q))),
    inscriptions:inscriptions.map(s=>({id:s.id,quete:s.quete,uid:s.uid,nom:s.nom,statut:s.statut,creeLe:new Date(s.creeMs).toISOString()}))};
  download("rose-des-vents-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(data,null,2));
}
function previewImport(obj){
  const list=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.quetes)?obj.quetes:null);
  if(!list)throw new Error("Le fichier doit contenir une liste « quetes ».");
  const del=(obj&&Array.isArray(obj.supprimer)?obj.supprimer:[]).filter(id=>questById(id));
  const add=[],upd=[],bad=[];let same=0;
  list.forEach(raw=>{
    if(!raw||!raw.titre||!office(raw.bureau)){bad.push(raw);return;}
    const id=String(raw.id||("q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6))).replace(/[^A-Za-z0-9_-]/g,"").slice(0,60);
    const q=normQuest(raw),cur=questById(id);
    if(!cur)add.push({id,q});
    else if(JSON.stringify(normQuest(cur))!==JSON.stringify(q))upd.push({id,q});
    else same++;
  });
  return {add,upd,del,same,bad};
}
async function applyImport(){
  const p=ui.importPreview;if(!p)return;
  await run("Import",async()=>{
    const ops=[];
    p.add.forEach(x=>ops.push(bt=>bt.set(doc(db,"quetes",x.id),Object.assign({},x.q,{creeLe:serverTimestamp(),majLe:serverTimestamp()}))));
    p.upd.forEach(x=>ops.push(bt=>bt.set(doc(db,"quetes",x.id),Object.assign({},x.q,{majLe:serverTimestamp()}),{merge:true})));
    p.del.forEach(id=>{ops.push(bt=>bt.delete(doc(db,"quetes",id)));signupsFor(id).forEach(s=>ops.push(bt=>bt.delete(doc(db,"inscriptions",s.id))));});
    for(let i=0;i<ops.length;i+=400){const bt=writeBatch(db);ops.slice(i,i+400).forEach(f=>f(bt));await bt.commit();}
  });
  ui.importPreview=null;render();
}
async function migrate(){
  const miss=seedMissing();
  await run("Migration",async()=>{
    const bt=writeBatch(db);
    miss.b.forEach((b,i)=>{const d={nom:b.nom,x:b.x,y:b.y,ordre:SEED.bureaux.findIndex(x=>x.id===b.id)};if(b.siege)d.siege=true;bt.set(doc(db,"bureaux",b.id),d);});
    await bt.commit();
    const bt2=writeBatch(db);
    miss.q.forEach(q=>{bt2.set(doc(db,"quetes",q.id),Object.assign(normQuest(q),{creeLe:serverTimestamp(),majLe:serverTimestamp()}));});
    await bt2.commit();
    const bt3=writeBatch(db);let n=0;
    miss.q.forEach(q=>(q.inscrits||[]).forEach((nom,i)=>{n++;bt3.set(doc(db,"inscriptions",q.id+"__dm-mig"+i),{quete:q.id,uid:"dm",nom:String(nom).slice(0,40),statut:"confirmee",creeLe:serverTimestamp()});}));
    if(n)await bt3.commit();
  });
}

  else if(a==="new"){ui.editing="new";ui.confirmDel=null;}

  else if(a==="wiki-edit"){ui.wikiEdit=id;ui.wikiPreview=false;}
  else if(a==="wiki-cancel"){ui.wikiEdit=null;ui.wikiPreview=false;}

  }
  if(e.target.id==="scaleform"){
    const niveaux=scaleList().map(s=>({n:s.n,titre:v("sc-t"+s.n).slice(0,40)||s.titre,effet:v("sc-e"+s.n).slice(0,300)}));
    ui.scaleEdit=false;
    await run("Échelle",()=>setDoc(doc(db,"config","renommee"),{niveaux,majLe:serverTimestamp()}));return;
  }
  if(e.target.id==="nameform"){
    const qid=e.target.getAttribute("data-id"),name=v("f-addname").slice(0,40);if(!name)return;
    ui.addName=null;
    await run("Ajout",()=>setDoc(doc(db,"inscriptions",qid+"__dm-"+Date.now().toString(36)),{quete:qid,uid:"dm",nom:name,statut:"confirmee",creeLe:serverTimestamp()}));
    return;
  }
  if(e.target.id==="qform"){
    const isNew=ui.editing==="new";
    const id=isNew?("q"+Date.now().toString(36)):ui.editing;
    const sup=document.getElementById("f-super");
    const jmin=v("f-jmin"),jmax=v("f-jmax");
    const q=normQuest({bureau:v("f-bureau"),titre:v("f-titre")||"Quête sans titre",type:v("f-type"),rang:v("f-rang"),statut:v("f-statut"),lieu:v("f-lieu"),recompense:v("f-recompense"),niveau:v("f-niveau"),
      joueursMin:jmin===""?null:+jmin,joueursMax:jmax===""?null:+jmax,supercharged:!!(sup&&sup.checked),date:v("f-date"),description:v("f-desc")});
    if(q.joueursMin!=null&&q.joueursMax!=null&&q.joueursMin>q.joueursMax)q.joueursMin=q.joueursMax;
    q.joueurs=q.joueursMin!=null&&q.joueursMax!=null?(q.joueursMin===q.joueursMax?String(q.joueursMin):q.joueursMin+" à "+q.joueursMax):(q.joueursMin!=null?q.joueursMin+" et +":"?");
    const cur=isNew?null:questById(id);
    ui.editing=null;
    await run("Enregistrement",()=>cur?setDoc(doc(db,"quetes",id),Object.assign(q,{majLe:serverTimestamp()}),{merge:true}):setDoc(doc(db,"quetes",id),Object.assign(q,{creeLe:serverTimestamp(),majLe:serverTimestamp()})));
  }
});

/* ---------- start ---------- */
route();
render();
listen();
</script>
</body>
</html>
