<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Babillard de la Rose des Vents</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style id="bb-style">
/* Layout: a parchment map of the Sword Coast on a dark guild board; each office opens its own notice board of pinned parchment quests. */
:root{
  --board:#0e1b20; --board-2:#14272d; --line:#2a434a;
  --parch:#ece3cb; --parch-2:#e2d6b6; --parch-3:#d9c9a0; --ink:#2a2219; --ink-soft:#5a4d3c;
  --sea:#c9c3a6; --land:#eadfbf;
  --gold:#d8b45e; --on-board:#f1e9d2; --on-board-muted:#a9bcb6;
  --open:#2f6d43; --progress:#8a5b12; --done:#5f564b;
  --r-cuivre:#b8733a; --r-fer:#7b8a93; --r-argent:#c3ccd2; --r-or:#d8b45e; --r-mithral:#86cfcb;
  --danger:#9b2c22;
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'EB Garamond', Garamond, Georgia, serif;
  color-scheme:dark;
}
body{background:var(--board);color:var(--on-board);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:26px}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header svg{flex:none}
.head-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{font-style:italic;color:var(--on-board-muted);font-size:18px}
.back{align-self:flex-start;font-family:var(--display);font-size:13px;letter-spacing:.1em;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:40px;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px}
.back:hover{border-color:var(--gold)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-size:13px;letter-spacing:.08em;background:transparent;color:var(--on-board-muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer}
.chip:hover{color:var(--on-board);border-color:var(--on-board-muted)}
.chip[aria-pressed="true"]{background:var(--gold);color:#1b1408;border-color:var(--gold)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:6px}
select,input,textarea{font:inherit;font-family:var(--body);text-transform:none;letter-spacing:normal;font-size:16px;color:var(--ink);background:#f7f1e1;border:1px solid #b9a982;border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
.bar select{background:var(--board-2);color:var(--on-board);border-color:var(--line);width:auto;font-family:var(--display);font-size:13px;letter-spacing:.06em;min-height:38px}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:24px;align-items:start}
.map{background:var(--parch-3);border-radius:6px;padding:10px;box-shadow:0 14px 30px rgba(0,0,0,.5);min-width:0}
.map svg{display:block;width:100%;height:auto}
.mk{cursor:pointer;outline:none}
.mk .mk-in{transition:transform .18s ease;transform-box:fill-box;transform-origin:center}
.mk:hover .mk-in,.mk:focus-visible .mk-in{transform:scale(1.14)}
.mk:focus-visible .ring{stroke:#1b1408;stroke-width:5}
.mk.zero{opacity:.72}
.offices{display:flex;flex-direction:column;gap:10px;min-width:0}
.offices h2{font-family:var(--display);font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.office{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--on-board);background:var(--board-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:48px;box-sizing:border-box}
.office:hover,.office:focus-visible{border-color:var(--gold);outline:none}
.office .nm{font-family:var(--display);font-size:15px;letter-spacing:.04em}
.office .tag{display:block;font-family:var(--body);font-style:italic;font-size:14px;color:var(--on-board-muted);letter-spacing:0}
.count{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;background:var(--parch);color:var(--ink);border-radius:4px;padding:4px 10px;font-size:14px;white-space:nowrap}
.count.zero{background:transparent;color:var(--on-board-muted);border:1px solid var(--line)}
.hint{color:var(--on-board-muted);font-size:15px;font-style:italic;margin:4px 0 0}
@media (max-width:860px){.mapwrap{grid-template-columns:1fr}}

/* board */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px 22px;align-items:start}
.note{position:relative;background:var(--parch);color:var(--ink);border-radius:3px;padding:26px 22px 20px;box-shadow:0 10px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;min-width:0}
.note:nth-child(3n+1){transform:rotate(-.6deg)} .note:nth-child(3n+2){transform:rotate(.5deg)}
.note::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0d58c,#9b7424 70%);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.note.done{background:var(--parch-2);opacity:.82}
.note-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.seal{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.seal i{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.kind{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.note h2{font-family:var(--display);font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
.desc{margin:0;white-space:pre-line}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:15.5px;border-top:1px dashed #b9a982;padding-top:10px}
.facts dt{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);padding-top:3px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stamp{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:2px solid currentColor;border-radius:4px;padding:3px 7px;transform:rotate(3deg);white-space:nowrap}
.st-ouverte{color:var(--open)} .st-encours{color:var(--progress)} .st-terminee{color:var(--done)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{font-family:var(--display);font-size:13px;letter-spacing:.08em;border-radius:6px;padding:9px 14px;min-height:40px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--parch)}
.btn:hover{background:#000}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(0,0,0,.06)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1408}
.btn.gold:hover{background:#e6c675}
.btn.board{background:transparent;color:var(--on-board);border-color:var(--line)}
.btn.board:hover{border-color:var(--on-board-muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.copybox{background:#f7f1e1;border:1px dashed #b9a982;border-radius:6px;padding:10px;font-size:15px;user-select:all}
.toast{font-size:15px;color:var(--open);font-style:italic}
.empty{grid-column:1/-1;text-align:center;color:var(--on-board-muted);font-style:italic;padding:40px 0}
.dmbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--board-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.dmbar .msg{flex:1 1 220px;color:var(--on-board-muted);font-size:15px;min-width:0}
.form{grid-column:1/-1;background:var(--parch);color:var(--ink);border-radius:4px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form h2{grid-column:1/-1;font-family:var(--display);margin:0;font-size:20px}
.form label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.form .wide{grid-column:1/-1}
.form textarea{min-height:110px;resize:vertical}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--on-board-muted);font-size:15px}
.legend .seal{color:var(--on-board-muted)}
footer{color:var(--on-board-muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.linkbtn{background:none;border:none;color:var(--on-board-muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;padding:6px 0;min-height:32px}
.linkbtn:hover{color:var(--on-board)}
@media (max-width:520px){.note{transform:none!important}.facts{grid-template-columns:1fr}.facts dt{padding-top:6px}}
.names{display:flex;flex-wrap:wrap;gap:4px 10px}
.name{display:inline-flex;align-items:center;gap:4px}
.name em{color:var(--ink-soft);font-size:14px}
.rm{border:1px solid #b9a982;background:transparent;color:var(--danger);border-radius:50%;width:26px;height:26px;line-height:1;font-size:16px;cursor:pointer;padding:0}
.rm:hover{background:rgba(155,44,34,.1)}
.modal-bg{position:fixed;inset:0;background:rgba(5,10,12,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--parch);color:var(--ink);border-radius:6px;padding:24px;max-width:440px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.modal h2{font-family:var(--display);font-size:20px;margin:0;text-wrap:balance}
.modal p{margin:0;font-size:15.5px;color:var(--ink-soft)}
.modal label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.mk .mk-in{transition:none}}

/* missions en cours */
.encours th[scope=row] a{color:var(--gold);font-family:var(--display);font-size:15px}
.encours .seal{color:var(--on-board)}
.stamp.sm{font-size:9px;padding:2px 5px;margin-left:6px;vertical-align:middle}
.chr-h{font-family:var(--display);font-size:20px;letter-spacing:.08em;color:var(--gold);margin:28px 0 12px}
.note.flash{outline:4px solid var(--gold);outline-offset:4px;transition:outline-color 1.4s ease}
/* gazette */
.gazette{margin-top:28px;background:#efe3c4;color:var(--ink);border-radius:6px;padding:22px 24px 26px;box-shadow:0 14px 30px rgba(0,0,0,.45);background-image:repeating-linear-gradient(0deg,rgba(90,70,40,.035) 0 2px,transparent 2px 4px)}
.gzhead{text-align:center;border-bottom:3px double #6b5838;padding-bottom:12px;margin-bottom:16px}
.gzkick{display:block;font-family:var(--display);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#8a2d1f}
.gzhead h2{font-family:var(--display);font-size:clamp(26px,5vw,42px);letter-spacing:.04em;margin:4px 0;color:#2a2219}
.gzsub{font-style:italic;color:var(--ink-soft)}
.gzcols{columns:3 280px;column-gap:28px;column-rule:1px solid #c9b88f}
.gzart{break-inside:avoid;margin:0 0 18px}
.gzart h3{font-family:var(--display);font-size:20px;margin:4px 0 6px;line-height:1.2}
.gzart.lead h3{font-size:26px}
.gzart .wikibody p{margin:0 0 8px}
.gzart .wikibody p:first-child::first-letter{font-family:var(--display);font-size:2.4em;float:left;line-height:.9;margin:4px 6px 0 0;color:#8a2d1f}
.gzmore{text-align:center;margin:6px 0 0}
.ntop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ntop .jd{font-size:13px;color:var(--ink-soft);font-style:italic}
.nchars{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.nchar{display:inline-flex;align-items:center;gap:6px;background:#2a2219;color:var(--parch);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;text-decoration:none}
.nchar img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.nchar:not(:has(img)){padding-left:10px}
.news{display:flex;flex-direction:column;gap:12px}
.newsitem{background:var(--parch);color:var(--ink);border-radius:6px;padding:12px 16px}
.newsitem h3{font-family:var(--display);margin:4px 0}
.sheet .newsitem{background:#f7f1e1;border:1px solid #d9c9a0}
.majline{background:#fff1cc;border-left:4px solid var(--gold);padding:6px 10px;margin:0 0 10px;font-size:15px}
/* espace DM */
.dmtabs{margin-bottom:16px}
.chip .n.warn{background:var(--danger);color:#fff}
.dmspace{background:var(--parch);color:var(--ink);border-radius:8px;padding:18px 20px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.dmsec{margin:0 0 20px}
.dmsec h2{font-family:var(--display);font-size:18px;letter-spacing:.06em;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dmsec h2 .n{font-size:12px;background:#2a2219;color:var(--parch);border-radius:999px;padding:2px 8px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #d9c9a0;flex-wrap:wrap}
.todo li>span{flex:1 1 240px}
a.mini{text-decoration:none;display:inline-block}
.dmspace .mini{color:var(--ink)}
.mini.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.dmspace .compbar input[type=search]{background:#fffaf0;color:var(--ink);border-color:#c9b88f}
.warn{color:var(--danger)}
.dmseuil{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:14px}
.dmseuil input{width:80px}
.prog{display:inline-block;width:110px;height:10px;border-radius:5px;background:#d9c9a0;vertical-align:middle;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.dmtable tr.due{background:#fbe7c6}
.evq{border-bottom:1px solid #d9c9a0;padding:8px 0}
.evfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:6px 0 0 30px}
.evfields .wide{grid-column:1/-1}
.evlog{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:0 0 14px}
.cpick{display:flex;flex-wrap:wrap;gap:6px}
.cpk{display:inline-flex;align-items:center;gap:6px;border:1px solid #c9b88f;border-radius:999px;padding:4px 10px;font-size:14px;cursor:pointer;background:#fffaf0}
.cpk:has(input:checked){background:#2a2219;color:var(--parch)}
.notes{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.note-dm{background:#f7f1e1;border:1px solid #d9c9a0;border-radius:6px;padding:10px 14px}
.note-dm.pin{border-color:var(--gold);border-width:2px}
.nhead{all:unset;display:flex;flex-direction:column;gap:4px;cursor:pointer;width:100%}
.nhead:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nhead strong{font-family:var(--display);font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.tile{background:#2a2219;color:var(--parch);border-radius:6px;padding:12px;display:flex;flex-direction:column}
.tn{font-family:var(--display);font-size:30px;color:var(--gold)}
.tl{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.dmform h2{margin-top:0}
.form label.pickrow,.form label.cpk{flex-direction:row;align-items:center;text-transform:none;letter-spacing:normal;font-family:var(--body);font-size:15px;color:var(--ink)}
.form label.pickrow strong{font-family:var(--display)}
.form .cpk input,.form .pickrow input{width:auto;margin:0}
.evq .pickrow{background:none}
.form label.cpk:has(input:checked){color:var(--parch)}
@media (max-width:560px){.dmspace{padding:14px 12px}.evfields{margin-left:0}.gazette{padding:16px 14px}}
/* planification */
.planline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;font-size:15px}
.mini.plan{font-size:13px}
.tablewrap{overflow-x:auto;max-width:100%}
.plantable{border-collapse:collapse;min-width:100%;font-size:15px}
.plantable th,.plantable td{border:1px solid #d9c9a0;padding:6px 8px;text-align:center;vertical-align:middle}
.plantable th[scope=row]{text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--parch)}
.plantable thead th{font-family:var(--display);font-size:13px;letter-spacing:.04em;white-space:nowrap}
.plantable thead th .tag{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
.plantable thead th.best{background:#f3e3b0}
.plantable thead th.dmno{opacity:.55}
.plantable thead th .rm{margin-left:6px}
.plantable .dmrow th,.plantable .dmrow td{background:#efe6cf}
.plantable .merow th,.plantable .merow td{background:#fbf3dc}
.plantable .tot td,.plantable .tot th{font-weight:600}
.pc.v-oui{color:#2f6b2f}.pc.v-peut{color:#8a6a10}.pc.v-non{color:var(--danger)}.pc.v-none{color:#a89a78}
.pbtn{min-width:40px;min-height:36px;border:2px solid currentColor;border-radius:6px;background:#fffaf0;color:inherit;font-size:17px;font-weight:700;cursor:pointer}
.pbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.planadd{margin-top:14px}
/* compendium */
.compbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.compbar input[type=search]{flex:1 1 240px;background:var(--board-2);color:var(--on-board);border-color:var(--line);width:auto}
.compbar select{width:auto;background:var(--board-2);color:var(--on-board);border-color:var(--line);min-height:40px}
.compgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ccard{display:flex;flex-direction:column;background:var(--parch);color:var(--ink);border-radius:6px;overflow:hidden;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.ccard:hover,.ccard:focus-visible{outline:3px solid var(--gold);outline-offset:0}
.ccard.hidden-entry{opacity:.6}
.cimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;max-width:100%}
.cbody{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px}
.cbody strong{font-family:var(--display);font-size:18px}
.cex{font-size:15px;color:var(--ink-soft)}
.ctags{display:flex;flex-wrap:wrap;gap:6px}
.ccat{font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:#2a2219;color:var(--parch);border-radius:999px;padding:3px 9px}
.ccat.masq{background:var(--danger)}
.qlink{font-style:italic;color:var(--ink-soft);margin:4px 0 10px}
.qlink a{color:var(--ink);font-weight:600}
.ccat.rev{background:var(--gold);color:#2a2219}
.revue{border:2px dashed var(--gold);border-radius:8px;padding:12px 14px;margin:6px 0 18px}
.revue h2{margin:0 0 10px;font-size:20px}
.revbox{background:#fff4d6;border:2px solid var(--gold);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.creg{font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #b9a982;color:var(--ink-soft);border-radius:999px;padding:2px 9px}
.journal.light li{border-bottom-color:#d9c9a0}
.journal.light .jd{color:var(--ink-soft)}
.verbody{display:block!important;background:#f7f1e1;border:1px dashed #c9b88f;border-radius:6px;padding:8px 12px}
.sheet .mini{color:var(--ink)}
/* galerie */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}

.inline.dark select,.inline.dark input{min-width:0}

}

/* ---------- planification (outil facultatif) ---------- */
const DISPO=["oui","peut","non"],DISPO_SYM={oui:"✓",peut:"?",non:"✗"},DISPO_LBL={oui:"Disponible",peut:"Peut-être",non:"Pas disponible"};
function todayIso(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function planDates(qid){const t=todayIso();return planifs.filter(p=>p.quete===qid&&p.date>=t).sort((a,b)=>(a.date+(a.heure||"")).localeCompare(b.date+(b.heure||"")));}
function fmtPlan(p){const d=new Date(p.date+"T12:00:00");return d.toLocaleDateString("fr-CA",{weekday:"short",day:"numeric",month:"short"})+(p.heure?", "+p.heure:"");}
function planRows(q){const seen={};return signupsFor(q.id).filter(s=>s.statut!=="refusee"&&s.uid&&s.uid.indexOf("dm-")!==0&&!seen[s.uid]&&(seen[s.uid]=1));}
function planScore(p,rows){let n=0;rows.forEach(r=>{const v=(p.dispo||{})[r.uid];if(v==="oui")n+=1;else if(v==="peut")n+=0.5;});return n;}
function planBest(q){const rows=planRows(q);let best=null,bs=0;planDates(q.id).forEach(p=>{if(p.dm==="non")return;const sc=planScore(p,rows);if(sc>bs){bs=sc;best=p;}});return best;}
function canPlan(q){return q.statut==="ouverte"&&(ui.dm||!!(user&&!user.isAnonymous&&signupsFor(q.id).some(s=>s.uid===user.uid&&s.statut!=="refusee")));}
function planLine(q){
  if(q.statut!=="ouverte")return "";const ds=planDates(q.id);if(!ds.length&&!canPlan(q))return "";
  const best=planBest(q),rows=planRows(q);
  const yes=best?rows.filter(r=>(best.dispo||{})[r.uid]==="oui").length:0;
  return '<p class="planline"><button class="mini plan" data-a="plan" data-id="'+esc(q.id)+'">📅 Planification</button>'+
    (best?'<span>Meilleure date : <strong>'+esc(fmtPlan(best))+'</strong> ('+yes+'/'+rows.length+')</span>':ds.length?'<span>'+ds.length+' date'+(ds.length>1?'s':'')+' proposée'+(ds.length>1?'s':'')+'</span>':'<span class="muted">Facultatif : proposez des dates</span>')+'</p>';
}

}

/* ---------- renommée ---------- */
function scaleList(){const l=scaleDoc&&Array.isArray(scaleDoc.niveaux)&&scaleDoc.niveaux.length?scaleDoc.niveaux:DEFAULT_SCALE;return l.slice().sort((a,b)=>a.n-b.n);}
function lvl(n){return scaleList().find(s=>s.n===n)||{n,titre:String(n),effet:""};}
function rnClass(n){return "rn rn"+(n<0?"m"+(-n):n>0?"p"+n:"0");}
function chip(n){return '<span class="'+rnClass(n)+'">'+esc(lvl(n).titre)+'</span>';}
function seuilOf(s){const v=priv&&priv.seuils&&priv.seuils[String(s.n)];return typeof v==="number"?v:((DEFAULT_SCALE.find(d=>d.n===s.n)||{seuil:0}).seuil);}
function rankPts(){return Object.assign({},DEFAULT_RANK_PTS,(priv&&priv.pointsParRang)||{});}
function mefaitPts(){return Object.assign({},DEFAULT_MEFAITS,(priv&&priv.mefaits)||{});}
function questPts(q){const o=priv&&priv.quetes&&priv.quetes[q.id];return typeof o==="number"?o:(rankPts()[q.rang]||0);}
function pts(a,bid){const m=pointsMap[a.id];return m&&typeof m[bid]==="number"?m[bid]:0;}
function levelOf(p){let n=0;scaleList().forEach(s=>{const t=seuilOf(s);if(s.n>0&&p>=t&&s.n>n)n=s.n;if(s.n<0&&p<=t&&s.n<n)n=s.n;});return n;}
// Le rang public est enregistré sur la fiche (niveaux) ; seul le DM voit les points.
function renown(a,bid){const v=a.niveaux&&a.niveaux[bid];return typeof v==="number"?v:0;}
function nextInfo(p){const lv=levelOf(p);const nx=scaleList().filter(s=>s.n>Math.max(lv,0)).sort((a,b)=>a.n-b.n)[0];return nx?{need:seuilOf(nx)-p,titre:nx.titre}:null;}
function ptsLabel(p){return (p>0?"+":"")+p+" pt"+(Math.abs(p)>1?"s":"");}
function addPoints(bt,a,bid,delta){
  const before=pts(a,bid),after=before+delta,oldLv=renown(a,bid),newLv=levelOf(after);
  bt.set(doc(db,"points",a.id),{parRegion:{[bid]:after}},{merge:true});
  pointsMap[a.id]=Object.assign({},pointsMap[a.id]||{},{[bid]:after});
  if(newLv!==oldLv){
    bt.update(doc(db,"aventuriers",a.id),new FieldPath("niveaux",bid),newLv,"majLe",serverTimestamp());
    bt.set(doc(collection(db,"rangs")),{aventurier:a.id,nom:a.nom,bureau:bid,ancien:oldLv,nouveau:newLv,date:serverTimestamp()});
  }
}
function reputationSection(bid,nom){

  let h='<section class="rep" aria-label="Réputation"><h2>Réputation à '+esc(nom)+'</h2>';
  if(!list.length)return h+'<p class="hint">Aucun aventurier n\'est encore inscrit au registre. <a href="#renommee">Voir le registre de renommée</a></p></section>';
  h+='<ul class="replist">'+list.map(a=>{const n=renown(a,bid),p=pts(a,bid);return '<li><span class="who">'+esc(a.nom)+(a.joueur?' <em>('+esc(a.joueur)+')</em>':'')+(ui.dm?'<span class="pts">'+ptsLabel(p)+'</span>':'')+'</span>'+chip(n)+'</li>';}).join("")+'</ul>';

}

  if(!loaded.a)return '<p class="hint">Chargement…</p>';
  if(!a)return '<p class="empty">Cette fiche n\'existe pas. <a href="#renommee">Retour au registre</a></p>';

  const qs=questsOf(a);

function resizeImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=()=>rej(new Error("Lecture impossible"));
    r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("Image illisible"));im.onload=()=>{
      const max=360,sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.82));};im.src=r.result;};
    r.readAsDataURL(file);
  });
}

function compFind(id){return compAllRaw().find(x=>x.id===id);}

function plainExcerpt(t){return String(t||"").replace(/[#*_>`|\[\]()-]/g," ").replace(/\s+/g," ").trim().slice(0,140);}
// Quêtes que le joueur peut lier : celles où un de ses personnages a été confirmé (en cours, terminées ou archivées). Le DM voit tout.

const NOTE_CATS = ["Intrigues","PNJ","Secrets","Idées de quêtes","Factions","Lieux"];
const RANK_ORDER = ["cuivre","fer","argent","or","mithral"];
function nextRank(r){const i=RANK_ORDER.indexOf(r);return i<0?"cuivre":RANK_ORDER[Math.min(i+1,RANK_ORDER.length-1)];}
function seuilMonde(){const v=monde&&monde.seuil;return typeof v==="number"&&v>0?v:3;}
function doneIn(bid){return quetes.filter(q=>q.bureau===bid&&q.rapport&&(q.statut==="terminee"||q.statut==="archivee"));}
function pendingIn(bid){const r=(monde&&monde.regions&&monde.regions[bid])||{},vues=r.vues||[];return doneIn(bid).filter(q=>vues.indexOf(q.id)<0);}
function dueRegions(){return bureaux.filter(b=>pendingIn(b.id).length>=seuilMonde());}
function newsFor(bid){return nouvelles.filter(n=>!bid||n.region===bid||(bid&&n.region==="cote")).sort((a,b)=>tms(b.date)-tms(a.date));}
function tms(t){return t&&t.toMillis?t.toMillis():0;}

function draftFromQuest(q){const r=q.rapport||{},b=office(q.bureau),parts=(r.participants||[]);
  const names=parts.map(x=>x.nom),who=names.length>1?names.slice(0,-1).join(", ")+" et "+names[names.length-1]:(names[0]||"des aventuriers de la Guilde");

function download(name,text){
  const blob=new Blob([text],{type:"application/json"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportJSON(){
  const data={format:"rose-des-vents",version:1,exporteLe:new Date().toISOString(),
    bureaux:bureaux.map(b=>Object.assign({},b)),
    quetes:quetes.map(q=>Object.assign({id:q.id},normQuest(q))),
    inscriptions:inscriptions.map(s=>({id:s.id,quete:s.quete,uid:s.uid,nom:s.nom,statut:s.statut,creeLe:new Date(s.creeMs).toISOString()}))};
  download("rose-des-vents-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(data,null,2));
}
function previewImport(obj){
  const list=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.quetes)?obj.quetes:null);
  if(!list)throw new Error("Le fichier doit contenir une liste « quetes ».");
  const del=(obj&&Array.isArray(obj.supprimer)?obj.supprimer:[]).filter(id=>questById(id));
  const add=[],upd=[],bad=[];let same=0;
  list.forEach(raw=>{
    if(!raw||!raw.titre||!office(raw.bureau)){bad.push(raw);return;}
    const id=String(raw.id||("q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6))).replace(/[^A-Za-z0-9_-]/g,"").slice(0,60);
    const q=normQuest(raw),cur=questById(id);
    if(!cur)add.push({id,q});
    else if(JSON.stringify(normQuest(cur))!==JSON.stringify(q))upd.push({id,q});
    else same++;
  });
  return {add,upd,del,same,bad};
}
async function applyImport(){
  const p=ui.importPreview;if(!p)return;
  await run("Import",async()=>{
    const ops=[];
    p.add.forEach(x=>ops.push(bt=>bt.set(doc(db,"quetes",x.id),Object.assign({},x.q,{creeLe:serverTimestamp(),majLe:serverTimestamp()}))));
    p.upd.forEach(x=>ops.push(bt=>bt.set(doc(db,"quetes",x.id),Object.assign({},x.q,{majLe:serverTimestamp()}),{merge:true})));
    p.del.forEach(id=>{ops.push(bt=>bt.delete(doc(db,"quetes",id)));signupsFor(id).forEach(s=>ops.push(bt=>bt.delete(doc(db,"inscriptions",s.id))));});
    for(let i=0;i<ops.length;i+=400){const bt=writeBatch(db);ops.slice(i,i+400).forEach(f=>f(bt));await bt.commit();}
  });
  ui.importPreview=null;render();
}
async function migrate(){
  const miss=seedMissing();
  await run("Migration",async()=>{
    const bt=writeBatch(db);
    miss.b.forEach((b,i)=>{const d={nom:b.nom,x:b.x,y:b.y,ordre:SEED.bureaux.findIndex(x=>x.id===b.id)};if(b.siege)d.siege=true;bt.set(doc(db,"bureaux",b.id),d);});
    await bt.commit();
    const bt2=writeBatch(db);
    miss.q.forEach(q=>{bt2.set(doc(db,"quetes",q.id),Object.assign(normQuest(q),{creeLe:serverTimestamp(),majLe:serverTimestamp()}));});
    await bt2.commit();
    const bt3=writeBatch(db);let n=0;
    miss.q.forEach(q=>(q.inscrits||[]).forEach((nom,i)=>{n++;bt3.set(doc(db,"inscriptions",q.id+"__dm-mig"+i),{quete:q.id,uid:"dm",nom:String(nom).slice(0,40),statut:"confirmee",creeLe:serverTimestamp()});}));
    if(n)await bt3.commit();
  });
}

// Joueur : la sauvegarde devient une proposition en revue. DM : publication directe.
async function saveComp(id,data,isNew){
  const by=compBy(),ref=doc(db,"compendium",id),f=compFields(data);
  return run("Compendium",async()=>{
    if(ui.dm){
      const bt=writeBatch(db);
      if(isNew)bt.set(ref,Object.assign({},f,{publiee:true,masque:false,proposition:null,creePar:by,modifiePar:by,creeLe:serverTimestamp(),majLe:serverTimestamp()}));
      else bt.set(ref,Object.assign({},f,{publiee:true,proposition:null,modifiePar:by,majLe:serverTimestamp()}),{merge:true});
      bt.set(doc(collection(db,"compendium",id,"versions")),Object.assign({},f,{par:by,approbateurs:{},date:serverTimestamp()}));
      await bt.commit();return;
    }
    const prop=Object.assign({},f,{par:by,approbations:{},date:serverTimestamp()});
    if(isNew)await setDoc(ref,Object.assign({},f,{publiee:false,masque:false,proposition:prop,creePar:by,creeLe:serverTimestamp()}));
    else await updateDoc(ref,{proposition:prop});
  });
}
// Approbation : la 2e approbation (ou le DM) publie la proposition et l'inscrit dans l'historique.
async function approveComp(e,force){
  const by=compBy(),p=e.proposition,ref=doc(db,"compendium",e.id);
  const appr=Object.assign({},p.approbations||{});if(!force)appr[by.uid]=by.nom;
  const done=force||Object.keys(appr).length>=2;
  return run(done?"Publication":"Approbation",async()=>{
    if(!done){await updateDoc(ref,{["proposition.approbations."+by.uid]:by.nom});return;}
    const f=compFields(p),bt=writeBatch(db);
    bt.update(ref,Object.assign({},f,{publiee:true,proposition:null,modifiePar:p.par,majLe:serverTimestamp()}));
    bt.set(doc(collection(db,"compendium",e.id,"versions")),Object.assign({},f,{par:p.par,approbateurs:appr,date:serverTimestamp()},force?{parDM:true}:{}));
    await bt.commit();
  });
}

    const isNew=ui.sheetEdit==="new",cur=isNew?null:aventuriers.find(a=>a.id===ui.sheetEdit);
    const nom=v("p-nom").slice(0,60);if(!nom)return;
    const data={nom,espece:v("p-espece").slice(0,60),classe:v("p-classe").slice(0,60),description:((document.getElementById("p-desc")||{}).value||"").slice(0,2000),background:((document.getElementById("p-bg")||{}).value||"").slice(0,4000),majLe:serverTimestamp()};
    const img=ui.sheetImg!==undefined?ui.sheetImg:(cur&&cur.image)||"";data.image=img;
    let id=cur?cur.id:(nom.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"perso").slice(0,40)+"-"+Date.now().toString(36).slice(-4);
    ui.sheetEdit=null;ui.sheetImg=undefined;
    const ok=await run("Fiche",()=>isNew?setDoc(doc(db,"aventuriers",id),Object.assign(data,{proprietaire:user.uid,joueur:String(user.displayName||"").slice(0,60),creeLe:serverTimestamp()})):setDoc(doc(db,"aventuriers",id),data,{merge:true}));
    if(ok)location.hash="#perso-"+id;return;
  }
  if(e.target.id==="donform"){
    const id=e.target.getAttribute("data-id");await run("Don",()=>setDoc(doc(db,"aventuriers",id),{don:v("p-don").slice(0,500),majLe:serverTimestamp()},{merge:true}));return;
  }
  if(e.target.id==="advform"){
    const nom=v("f-advnom").slice(0,60),joueur=v("f-advjoueur").slice(0,60);if(!nom)return;
    const id=(nom.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"aventurier").slice(0,40)+"-"+Date.now().toString(36).slice(-4);
    ui.advForm=false;
    await run("Ajout",()=>setDoc(doc(db,"aventuriers",id),{nom,joueur,niveaux:{},creeLe:serverTimestamp(),majLe:serverTimestamp()}));return;
  }
  if(e.target.id==="completeform"){
    const C=ui.complete,q=C&&questById(C.id);if(!q)return;
    readStep();
    if(C.step<3){C.step++;render();return;}
    const mp=mefaitPts();
    const rapport={date:C.rapport.date,resultat:C.rapport.resultat,resume:C.rapport.resume,participants:C.parts.map(x=>({nom:x.nom,aventurier:x.aventurier||null})),termineLe:serverTimestamp()};
    ui.complete=null;
    await run("Fin de quête",async()=>{
      const bt=writeBatch(db);
      bt.set(doc(db,"quetes",q.id),{statut:"terminee",rapport,rapportBrouillon:null,redacteur:null,majLe:serverTimestamp()},{merge:true});
      const seen={};
      C.parts.forEach(x=>{const a=x.aventurier&&aventuriers.find(y=>y.id===x.aventurier);if(!a)return;
        const pen=Object.keys(DEFAULT_MEFAITS).reduce((t,k)=>t+(x[k]||0)*mp[k],0),net=(x.gain||0)-pen;
        const det=Object.keys(DEFAULT_MEFAITS).filter(k=>x[k]).map(k=>x[k]+" "+MEFAIT_LABELS[k].toLowerCase()+(x[k]>1?"s":"")).join(", ");
        seen[a.id]=(seen[a.id]||0)+net;
        bt.set(doc(collection(db,"journal")),{aventurier:a.id,nom:a.nom,bureau:q.bureau,points:net,raison:"Quête : "+q.titre+" (gain +"+(x.gain||0)+(pen?", méfaits −"+pen+" : "+det:"")+")",quete:q.id,date:serverTimestamp()});});
      Object.keys(seen).forEach(id=>{if(seen[id])addPoints(bt,aventuriers.find(y=>y.id===id),q.bureau,seen[id]);});
      await bt.commit();
    });return;
  }
  if(e.target.id==="seuilform"){const n=Math.max(1,Math.min(50,Math.round(+v("ev-seuil")||3)));await run("Seuil",()=>setDoc(doc(db,"prive","monde"),{seuil:n},{merge:true}));return;}
  if(e.target.id==="noteform"){
    const titre=v("n-titre").slice(0,120);if(!titre)return;const isNew=ui.noteEdit==="new",id=isNew?doc(collection(db,"notesdm")).id:ui.noteEdit;
    const pin=document.getElementById("n-pin");
    const d={titre,categorie:v("n-cat").slice(0,40),region:v("n-reg"),contenu:((document.getElementById("n-contenu")||{}).value||"").slice(0,50000),epingle:!!(pin&&pin.checked),majLe:serverTimestamp()};
    if(isNew)d.creeLe=serverTimestamp();ui.noteEdit=null;ui.noteOpen=id;
    await run("Note",()=>setDoc(doc(db,"notesdm",id),d,{merge:true}));return;
  }
  if(e.target.id==="newsform"){
    const titre=v("nw-titre").slice(0,120);if(!titre)return;const ed=ui.newsEdit,isFrom=ed.indexOf("from:")===0,isNew=ed==="new"||isFrom;
    const cur=isNew?null:nouvelles.find(n=>n.id===ed);const id=isNew?doc(collection(db,"nouvelles")).id:ed;
    const chars=[];document.querySelectorAll("#newsform input[data-nwc]").forEach(c=>{if(c.checked)chars.push(c.getAttribute("data-nwc"));});
    const d={titre,region:v("nw-reg")||"cote",contenu:((document.getElementById("nw-texte")||{}).value||"").slice(0,5000),aventuriers:chars,quete:isFrom?ed.slice(5):((cur&&cur.quete)||"")};
    if(isNew)d.date=serverTimestamp();ui.newsEdit=null;
    await run("Nouvelle publiée",()=>setDoc(doc(db,"nouvelles",id),d,{merge:true}));return;
  }
  if(e.target.id==="evolform"){
    const bid=ui.evolve;if(!bid)return;
    const notes=((document.getElementById("ev-notes")||{}).value||"").slice(0,10000),nt=v("ev-ntitre").slice(0,120),nx=((document.getElementById("ev-ntexte")||{}).value||"").slice(0,5000);
    const chars=[];document.querySelectorAll("#evolform input[data-evc]").forEach(c=>{if(c.checked)chars.push(c.getAttribute("data-evc"));});
    const changes=[];document.querySelectorAll("#evolform input[data-evq]").forEach(c=>{if(!c.checked)return;const qid=c.getAttribute("data-evq"),q=questById(qid);if(!q)return;
      changes.push({quete:qid,titre:q.titre,ancienRang:q.rang,nouveauRang:v("ev-r-"+qid)||q.rang,maj:v("ev-m-"+qid).slice(0,1000),recompense:v("ev-p-"+qid).slice(0,200)});});
    const pend=pendingIn(bid).map(q=>q.id),allDone=doneIn(bid).map(q=>q.id);
    ui.evolve=null;
    await run("Évolution enregistrée",async()=>{
      const bt=writeBatch(db);let nid=null;
      if(nt){nid=doc(collection(db,"nouvelles")).id;bt.set(doc(db,"nouvelles",nid),{titre:nt,contenu:nx,region:bid,aventuriers:chars,quete:"",date:serverTimestamp()});}
      changes.forEach(c=>{const up={rang:c.nouveauRang,recompense:c.recompense,majLe:serverTimestamp()};if(c.maj)up.maj=c.maj;bt.set(doc(db,"quetes",c.quete),up,{merge:true});});
      bt.set(doc(collection(db,"evolutions")),{region:bid,date:serverTimestamp(),quetes:pend,notes,changements:changes.map(c=>({quete:c.quete,titre:c.titre,ancienRang:c.ancienRang,nouveauRang:c.nouveauRang,maj:c.maj})),nouvelle:nid,nouvelleTitre:nt});
      bt.set(doc(db,"prive","monde"),{regions:{[bid]:{vues:allDone}}},{merge:true});
      await bt.commit();
    });return;
  }
  if(e.target.id==="planform"){
    const q=questById(ui.plan);if(!q)return;const date=v("pl-date"),heure=v("pl-heure").slice(0,30);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<todayIso())return;
    if(planDates(q.id).some(p=>p.date===date&&(p.heure||"")===heure)){save={state:"error",msg:"Cette date est déjà proposée."};render();return;}
    const by={uid:user.uid,nom:String(ui.dm?"Le DM":((signupsFor(q.id).find(x=>x.uid===user.uid)||{}).nom||user.displayName||"Aventurier")).slice(0,60)};
    const ref=doc(collection(db,"planif"));const d={quete:q.id,date,heure,par:by,dispo:{},creeLe:serverTimestamp()};
    if(ui.dm)d.dm="oui";else d.dispo[user.uid]="oui";
    const f1=document.getElementById("pl-date");if(f1)f1.value="";const f2=document.getElementById("pl-heure");if(f2)f2.value="";
    await run("Date proposée",()=>setDoc(ref,d));return;
  }
  if(e.target.id==="groupform"){
    const q=questById(ui.confirmGroup);if(!q)return;
    const picks={};document.querySelectorAll("#groupform input[data-sid]").forEach(c=>{picks[c.getAttribute("data-sid")]=c.checked;});
    if(!Object.values(picks).some(Boolean)){save={state:"error",msg:"Coche au moins un aventurier."};render();return;}
    const date=v("g-date").slice(0,80);ui.confirmGroup=null;
    await run("Groupe confirmé",async()=>{
      const bt=writeBatch(db);
      signupsFor(q.id).filter(x=>x.statut!=="refusee").forEach(x=>{const st=picks[x.id]?"confirmee":"refusee";if(st!==x.statut)bt.set(doc(db,"inscriptions",x.id),Object.assign({quete:x.quete,uid:x.uid,nom:x.nom,statut:st,creeLe:x.creeLe||serverTimestamp(),majLe:serverTimestamp()},x.aventurier?{aventurier:x.aventurier}:{}));});
      bt.set(doc(db,"quetes",q.id),{statut:"encours",date,majLe:serverTimestamp()},{merge:true});
      await bt.commit();
    });return;
  }
  if(e.target.id==="reportform"){
    const q=questById(ui.reportWrite);if(!q)return;
    const texte=((document.getElementById("r-texte")||{}).value||"").trim().slice(0,4000);if(!texte)return;
    const auteur=(signupsFor(q.id).find(x=>x.uid===user.uid)||{}).nom||user.displayName||"un joueur";
    ui.reportWrite=null;
    await run("Rapport",()=>setDoc(doc(db,"quetes",q.id),{rapportBrouillon:{resume:texte,auteur:String(auteur).slice(0,60),majLe:serverTimestamp()},majLe:serverTimestamp()},{merge:true}));
    ui.signupMsg={id:q.id,text:"Rapport envoyé au DM. Merci !"};render();return;
  }
  if(e.target.id==="adjform"){
    const a=aventuriers.find(y=>y.id===v("j-adv")),bid=v("j-b"),n=Math.round(+v("j-pts")||0),why=v("j-why").slice(0,200);if(!a||!n)return;
    ui.adjust=false;
    await run("Renommée",async()=>{const bt=writeBatch(db);addPoints(bt,a,bid,n);bt.set(doc(collection(db,"journal")),{aventurier:a.id,nom:a.nom,bureau:bid,points:n,raison:why||"Ajustement du DM",date:serverTimestamp()});await bt.commit();});return;
  }
  if(e.target.id==="wikiform"){
    const titre=v("w-titre").slice(0,100),contenu=(document.getElementById("w-contenu")||{}).value||"",o=v("w-ordre");if(!titre)return;
    const isNew=ui.wikiEdit==="new";let id=isNew?wikiSlug(titre):ui.wikiEdit;
    if(isNew&&wikiPages.some(p=>p.id===id))id=(id+"-"+Date.now().toString(36).slice(-3)).slice(0,60);
    const data={titre,contenu:contenu.slice(0,50000),majLe:serverTimestamp()};if(o!=="")data.ordre=+o;
    ui.wikiEdit=null;ui.wikiPreview=false;
    const ok=await run("Wiki",()=>isNew?setDoc(doc(db,"wiki",id),Object.assign(data,{creeLe:serverTimestamp()})):setDoc(doc(db,"wiki",id),data,{merge:true}));
    if(ok&&isNew)location.hash="#"+id;return;
  }
  if(e.target.id==="scaleform"){
    const niveaux=scaleList().map(s=>{const raw=v("sc-s"+s.n);return {n:s.n,seuil:s.n===0?0:(raw===""||isNaN(+raw)?seuilOf(s):Math.round(+raw)),titre:v("sc-t"+s.n).slice(0,40)||s.titre,effet:v("sc-e"+s.n).slice(0,300)};});
    ui.scaleEdit=false;
    const seuils={};niveaux.forEach(n=>{seuils[String(n.n)]=n.seuil;});
    const mefaits={};Object.keys(DEFAULT_MEFAITS).forEach(k=>{const x=v("mf-"+k);mefaits[k]=x===""||isNaN(+x)?mefaitPts()[k]:Math.abs(Math.round(+x));});
    await run("Échelle",async()=>{const bt=writeBatch(db);bt.set(doc(db,"config","renommee"),{niveaux:niveaux.map(n=>({n:n.n,titre:n.titre,effet:n.effet})),majLe:serverTimestamp()},{merge:true});bt.set(doc(db,"prive","renommee"),{seuils,mefaits},{merge:true});await bt.commit();
      // recalcul des rangs publics avec les nouveaux seuils
      const bt2=writeBatch(db);let k=0;aventuriers.forEach(a=>bureaux.forEach(b=>{const nl=levelOf(pts(a,b.id));if(nl!==renown(a,b.id)){k++;bt2.update(doc(db,"aventuriers",a.id),new FieldPath("niveaux",b.id),nl);}}));if(k)await bt2.commit();});return;
  }
  if(e.target.id==="nameform"){
    const qid=e.target.getAttribute("data-id"),name=v("f-addname").slice(0,40);if(!name)return;
    ui.addName=null;
    await run("Ajout",()=>setDoc(doc(db,"inscriptions",qid+"__dm-"+Date.now().toString(36)),{quete:qid,uid:"dm",nom:name,statut:"confirmee",creeLe:serverTimestamp()}));
    return;
  }
  if(e.target.id==="qform"){
    const isNew=ui.editing==="new";
    const id=isNew?("q"+Date.now().toString(36)):ui.editing;
    const sup=document.getElementById("f-super");
    const jmin=v("f-jmin"),jmax=v("f-jmax");
    const q=normQuest({bureau:v("f-bureau"),titre:v("f-titre")||"Quête sans titre",type:v("f-type"),rang:v("f-rang"),statut:v("f-statut"),lieu:v("f-lieu"),recompense:v("f-recompense"),niveau:v("f-niveau"),
      joueursMin:jmin===""?null:+jmin,joueursMax:jmax===""?null:+jmax,supercharged:!!(sup&&sup.checked),date:v("f-date"),description:v("f-desc"),maj:v("f-maj")});
    const ptsOverride=v("f-pts");
    if(q.joueursMin!=null&&q.joueursMax!=null&&q.joueursMin>q.joueursMax)q.joueursMin=q.joueursMax;
    q.joueurs=q.joueursMin!=null&&q.joueursMax!=null?(q.joueursMin===q.joueursMax?String(q.joueursMin):q.joueursMin+" à "+q.joueursMax):(q.joueursMin!=null?q.joueursMin+" et +":"?");
    const cur=isNew?null:questById(id);
    ui.editing=null;
    await run("Points",()=>setDoc(doc(db,"prive","renommee"),{quetes:{[id]:ptsOverride===""?null:Math.round(+ptsOverride)}},{merge:true}));
    await run("Enregistrement",()=>cur?setDoc(doc(db,"quetes",id),Object.assign(q,{majLe:serverTimestamp()}),{merge:true}):setDoc(doc(db,"quetes",id),Object.assign(q,{creeLe:serverTimestamp(),majLe:serverTimestamp()})));
  }
});

/* ---------- start ---------- */
route();
render();
listen();
</script>
</body>
