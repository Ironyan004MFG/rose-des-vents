<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Babillard de la Rose des Vents</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style id="bb-style">
/* Layout: a parchment map of the Sword Coast on a dark guild board; each office opens its own notice board of pinned parchment quests. */
:root{
  --board:#0e1b20; --board-2:#14272d; --line:#2a434a;
  --parch:#ece3cb; --parch-2:#e2d6b6; --parch-3:#d9c9a0; --ink:#2a2219; --ink-soft:#5a4d3c;
  --sea:#c9c3a6; --land:#eadfbf;
  --gold:#d8b45e; --on-board:#f1e9d2; --on-board-muted:#a9bcb6;
  --open:#2f6d43; --progress:#8a5b12; --done:#5f564b;
  --r-cuivre:#b8733a; --r-fer:#7b8a93; --r-argent:#c3ccd2; --r-or:#d8b45e; --r-mithral:#86cfcb;
  --danger:#9b2c22;
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'EB Garamond', Garamond, Georgia, serif;
  color-scheme:dark;
}
body{background:var(--board);color:var(--on-board);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:26px}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header svg{flex:none}
.head-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{font-style:italic;color:var(--on-board-muted);font-size:18px}
.back{align-self:flex-start;font-family:var(--display);font-size:13px;letter-spacing:.1em;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:40px;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px}
.back:hover{border-color:var(--gold)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-size:13px;letter-spacing:.08em;background:transparent;color:var(--on-board-muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer}
.chip:hover{color:var(--on-board);border-color:var(--on-board-muted)}
.chip[aria-pressed="true"]{background:var(--gold);color:#1b1408;border-color:var(--gold)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:6px}
select,input,textarea{font:inherit;font-family:var(--body);text-transform:none;letter-spacing:normal;font-size:16px;color:var(--ink);background:#f7f1e1;border:1px solid #b9a982;border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
.bar select{background:var(--board-2);color:var(--on-board);border-color:var(--line);width:auto;font-family:var(--display);font-size:13px;letter-spacing:.06em;min-height:38px}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:24px;align-items:start}
.mapwrap{grid-template-areas:"map nav" "gaz nav";grid-template-rows:auto 1fr}
.mapwrap>.map{grid-area:map}
.mapwrap>.offices{grid-area:nav}
.mapwrap>.gazette{grid-area:gaz;margin-top:0}
.map{background:var(--parch-3);border-radius:6px;padding:10px;box-shadow:0 14px 30px rgba(0,0,0,.5);min-width:0}
.map svg{display:block;width:100%;height:auto}
.mk{cursor:pointer;outline:none}
.mk .mk-in{transition:transform .18s ease;transform-box:fill-box;transform-origin:center}
.mk:hover .mk-in,.mk:focus-visible .mk-in{transform:scale(1.14)}
.mk:focus-visible .ring{stroke:#1b1408;stroke-width:5}
.mk.zero{opacity:.72}
.offices{display:flex;flex-direction:column;gap:10px;min-width:0}
.offices h2{font-family:var(--display);font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.office{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--on-board);background:var(--board-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:48px;box-sizing:border-box}
.office:hover,.office:focus-visible{border-color:var(--gold);outline:none}
.office .nm{font-family:var(--display);font-size:15px;letter-spacing:.04em}
.office .tag{display:block;font-family:var(--body);font-style:italic;font-size:14px;color:var(--on-board-muted);letter-spacing:0}
.count{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;background:var(--parch);color:var(--ink);border-radius:4px;padding:4px 10px;font-size:14px;white-space:nowrap}
.count.zero{background:transparent;color:var(--on-board-muted);border:1px solid var(--line)}
.hint{color:var(--on-board-muted);font-size:15px;font-style:italic;margin:4px 0 0}
@media (max-width:860px){.mapwrap{grid-template-columns:1fr;grid-template-areas:"map" "nav" "gaz";grid-template-rows:auto}}

/* board */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px 22px;align-items:start}
.note{position:relative;background:var(--parch);color:var(--ink);border-radius:3px;padding:26px 22px 20px;box-shadow:0 10px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;min-width:0}
.note:nth-child(3n+1){transform:rotate(-.6deg)} .note:nth-child(3n+2){transform:rotate(.5deg)}
.note::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0d58c,#9b7424 70%);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.note.done{background:var(--parch-2);opacity:.82}
.note-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.seal{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.seal i{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.kind{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.note h2{font-family:var(--display);font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
.desc{margin:0;white-space:pre-line}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:15.5px;border-top:1px dashed #b9a982;padding-top:10px}
.facts dt{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);padding-top:3px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stamp{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:2px solid currentColor;border-radius:4px;padding:3px 7px;transform:rotate(3deg);white-space:nowrap}
.st-ouverte{color:var(--open)} .st-encours{color:var(--progress)} .st-terminee{color:var(--done)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{font-family:var(--display);font-size:13px;letter-spacing:.08em;border-radius:6px;padding:9px 14px;min-height:40px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--parch)}
.btn:hover{background:#000}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(0,0,0,.06)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1408}
.btn.gold:hover{background:#e6c675}
.btn.board{background:transparent;color:var(--on-board);border-color:var(--line)}
.btn.board:hover{border-color:var(--on-board-muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.copybox{background:#f7f1e1;border:1px dashed #b9a982;border-radius:6px;padding:10px;font-size:15px;user-select:all}
.toast{font-size:15px;color:var(--open);font-style:italic}
.empty{grid-column:1/-1;text-align:center;color:var(--on-board-muted);font-style:italic;padding:40px 0}
.dmbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--board-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.dmbar .msg{flex:1 1 220px;color:var(--on-board-muted);font-size:15px;min-width:0}
.form{grid-column:1/-1;background:var(--parch);color:var(--ink);border-radius:4px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form h2{grid-column:1/-1;font-family:var(--display);margin:0;font-size:20px}
.form label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.form .wide{grid-column:1/-1}
.form textarea{min-height:110px;resize:vertical}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--on-board-muted);font-size:15px}
.legend .seal{color:var(--on-board-muted)}
footer{color:var(--on-board-muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.linkbtn{background:none;border:none;color:var(--on-board-muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;padding:6px 0;min-height:32px}
.linkbtn:hover{color:var(--on-board)}
@media (max-width:520px){.note{transform:none!important}.facts{grid-template-columns:1fr}.facts dt{padding-top:6px}}
.names{display:flex;flex-wrap:wrap;gap:4px 10px}
.name{display:inline-flex;align-items:center;gap:4px}
.name em{color:var(--ink-soft);font-size:14px}
.rm{border:1px solid #b9a982;background:transparent;color:var(--danger);border-radius:50%;width:26px;height:26px;line-height:1;font-size:16px;cursor:pointer;padding:0}
.rm:hover{background:rgba(155,44,34,.1)}
.modal-bg{position:fixed;inset:0;background:rgba(5,10,12,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--parch);color:var(--ink);border-radius:6px;padding:24px;max-width:440px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.modal h2{font-family:var(--display);font-size:20px;margin:0;text-wrap:balance}
.modal p{margin:0;font-size:15.5px;color:var(--ink-soft)}
.modal label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.mk .mk-in{transition:none}}

/* missions en cours */
.encours th[scope=row] a{color:var(--gold);font-family:var(--display);font-size:15px}
.encours .seal{color:var(--on-board)}
.stamp.sm{font-size:9px;padding:2px 5px;margin-left:6px;vertical-align:middle}
.chr-h{font-family:var(--display);font-size:20px;letter-spacing:.08em;color:var(--gold);margin:28px 0 12px}
.note.flash{outline:4px solid var(--gold);outline-offset:4px;transition:outline-color 1.4s ease}
/* gazette */
.gazette{margin-top:28px;background:#efe3c4;color:var(--ink);border-radius:6px;padding:22px 24px 26px;box-shadow:0 14px 30px rgba(0,0,0,.45);background-image:repeating-linear-gradient(0deg,rgba(90,70,40,.035) 0 2px,transparent 2px 4px)}
.gzhead{text-align:center;border-bottom:3px double #6b5838;padding-bottom:12px;margin-bottom:16px}
.gzkick{display:block;font-family:var(--display);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#8a2d1f}
.gzhead h2{font-family:var(--display);font-size:clamp(26px,5vw,42px);letter-spacing:.04em;margin:4px 0;color:#2a2219}
.gzsub{font-style:italic;color:var(--ink-soft)}
.gzcols{columns:2 260px;column-gap:28px;column-rule:1px solid #c9b88f}
.gzart{break-inside:avoid;margin:0 0 18px}
.gzart h3{font-family:var(--display);font-size:20px;margin:4px 0 6px;line-height:1.2}
.gzart.lead h3{font-size:26px}
.gzart .wikibody p{margin:0 0 8px}
.gzart .wikibody p:first-child::first-letter{font-family:var(--display);font-size:2.4em;float:left;line-height:.9;margin:4px 6px 0 0;color:#8a2d1f}
.gzmore{text-align:center;margin:6px 0 0}
.ntop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ntop .jd{font-size:13px;color:var(--ink-soft);font-style:italic}
.nchars{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.nchar{display:inline-flex;align-items:center;gap:6px;background:#2a2219;color:var(--parch);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;text-decoration:none}
.nchar img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.nchar:not(:has(img)){padding-left:10px}
.news{display:flex;flex-direction:column;gap:12px}
.newsitem{background:var(--parch);color:var(--ink);border-radius:6px;padding:12px 16px}
.newsitem h3{font-family:var(--display);margin:4px 0}
.sheet .newsitem{background:#f7f1e1;border:1px solid #d9c9a0}
.majline{background:#fff1cc;border-left:4px solid var(--gold);padding:6px 10px;margin:0 0 10px;font-size:15px}
/* aperçus d'images : on garde toujours le haut (la tête) visible */
img{object-position:50% 0}
.revealbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#eef4e6;border:1px solid #b9cfa5;border-radius:6px;padding:8px 12px;margin:12px 0}
/* avis de recherche */
.wantedwrap{margin:4px 0 22px}
.wantedwrap h2{font-family:var(--display);color:var(--on-board);font-size:20px;letter-spacing:.06em;margin:0 0 12px}
.wantedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.wanted{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:18px 14px 14px;text-decoration:none;color:#3a2a17;
  background:radial-gradient(ellipse at center,#f3e4bd 0%,#e7d3a0 65%,#cfb27a 100%);border:1px solid #b8975e;box-shadow:0 10px 22px rgba(0,0,0,.45);transform:rotate(-1.2deg)}
.wanted:nth-child(even){transform:rotate(1.4deg)}
.wanted::before{content:"";position:absolute;top:7px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9d4c7,#6e665a);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.wanted:hover,.wanted:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wtop{font-family:var(--display);font-size:clamp(20px,2.2vw,26px);font-weight:700;letter-spacing:.04em;max-width:100%;text-transform:uppercase;line-height:1;margin-top:6px}
.wetat{font-family:var(--display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;border-top:2px solid #3a2a17;border-bottom:2px solid #3a2a17;padding:2px 8px}
.w3 .wetat{color:#7a1410;border-color:#7a1410;font-size:15px;font-weight:700}
.wpic{width:78%;aspect-ratio:4/5;margin:8px 0 4px;border:3px solid #3a2a17;background:#efe0b6;overflow:hidden;display:flex;align-items:center;justify-content:center}
.wpic img{width:100%;height:100%;object-fit:cover}
.wpic img.sketch{filter:grayscale(1) contrast(2.1) brightness(1.25) sepia(.55);mix-blend-mode:multiply;opacity:.9}
.wpic img.clear{filter:sepia(.35) contrast(1.05)}
.wpic.none{border-style:dashed}
.wpic.none span{font-family:var(--display);font-size:64px;color:#9c8458}
.wnom{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.wid{font-style:italic;font-size:14px}
.wdesc{font-size:13.5px;font-style:italic;color:#5a4528}
.wcrime{font-size:13px}
.wprime{font-family:var(--display);font-size:22px;font-weight:700;color:#7a1410;margin-top:4px}
.w1 .wprime{font-size:17px}
.wfoot{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6b5434;margin-top:2px}
@media (prefers-reduced-motion:reduce){.wanted,.wanted:nth-child(even){transform:none}}
.portrait.emblem{object-fit:contain;background:#f3e9d0}
.mcard[href]{text-decoration:none}
/* Modules officiels */
.ccat.mod-avenir{background:#e2d6b6;color:#4a3d2a}
.ccat.mod-premices{background:#c08a1e;color:#fff}
.ccat.mod-encours{background:#7a1f14;color:#fff}
.ccat.mod-termine{background:#5a4d3c;color:#e8dfc8}
a.ccat{text-decoration:none}
.modline{list-style:none;margin:12px 0;padding:0 0 0 22px;border-left:3px solid var(--parch-3);display:flex;flex-direction:column;gap:12px}
.modline li{position:relative}
.modline li::before{content:"";position:absolute;left:-31px;top:18px;width:15px;height:15px;border-radius:50%;background:var(--parch-3);border:3px solid var(--parch)}
.modline li.mod-premices::before{background:#c08a1e}
.modline li.mod-encours::before{background:#7a1f14}
.modline li.mod-termine::before{background:#5a4d3c}
.modcard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:#f6efdb;border:1px solid var(--parch-3);border-radius:6px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink)}
.modcard strong{font-family:var(--display);font-size:18px}
.modcard:hover{background:#fff8e4}
.evmod{border:1px solid var(--parch-3);border-radius:6px;padding:8px 12px;margin-bottom:8px;background:#f6efdb}
.evmod summary{cursor:pointer}
.evmod h4{margin:10px 0 4px;font-family:var(--display);font-size:14px}
.repbox{border:1px dashed #a8946a;border-radius:6px;padding:10px 12px;margin:10px 0;background:rgba(255,255,255,.35)}
.repbox p{margin:0 0 6px}
.repsel{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.repsel label{display:flex;flex-direction:column;font-size:13px;gap:3px}
.repsel select{font:inherit;padding:6px 8px;min-height:40px;border-radius:4px;border:1px solid var(--parch-3)}
.dmrep{border:1px solid var(--parch-3);border-radius:6px;padding:8px 12px;margin:8px 0;background:#f6efdb;color:var(--ink)}
.dmrep summary{cursor:pointer;font-weight:700}
.dmrep .wikibody{font-size:15px}
.ptnotes{display:flex;flex-direction:column;gap:4px;font-size:14px;margin-bottom:10px}
.ptnotes textarea{font:inherit;font-size:15px;padding:8px;border:1px solid var(--parch-3);border-radius:4px;background:#fff;color:var(--ink)}
.ptrep{background:#fff;border:1px solid var(--parch-3);border-radius:6px;padding:10px 12px}
/* Rencontres (Mode Partie) */
.ptjoin{display:flex;flex-direction:column;gap:4px;font-size:14px;margin:6px 0 4px}
.ptjoin select{font:inherit;padding:8px;border:1px solid var(--parch-3);border-radius:4px;min-height:40px;background:#fff;color:var(--ink);max-width:100%}
.modal .ptchk,.ptchk{display:flex!important;flex-direction:row!important;align-items:center;gap:10px;font-family:inherit;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);min-height:44px}
.ptchk input{width:20px;height:20px;margin:0}
.pttabs{flex-wrap:wrap}
.pttabs button{flex:1 0 auto}
.ptstart{background:#f6efdb;border:1px solid var(--parch-3);border-radius:8px;padding:12px 14px}
.ptstart h3{margin-top:0}
.ptencf{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.ptencf label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.ptencf select,.ptencf input[type=text],.ptencf input:not([type]){font:inherit;padding:8px;border:1px solid var(--parch-3);border-radius:4px;min-height:40px;background:#fff;color:var(--ink)}
.ptencf .pickrow{flex-direction:row;align-items:center;gap:8px}
.ptphase{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--on-board);border-radius:8px;padding:10px 14px;margin-bottom:10px}
.ptphase strong{font-family:var(--display);font-size:18px;color:var(--gold)}
.ptphase .ptstep{margin-left:auto;font-size:13px;color:var(--on-board-muted)}
.ptphase .ptround.sm{margin-left:auto;flex-direction:row;gap:8px;padding:2px 12px;min-width:0;background:#000}

.ptrolls li strong{font-size:18px;min-width:36px;text-align:right}

.ptjournal{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:3px;font-size:14px}

.ptfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--parch-3);padding-top:12px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}

  .ptgrid{grid-template-columns:1fr}

}

.tablebox th,.tablebox td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:15.5px}
.tablebox thead th{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-board-muted);white-space:nowrap}
.tablebox td.num{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--on-board-muted);width:60px}
.roster th[scope=row]{font-family:var(--display);font-size:15px;white-space:nowrap}
.roster .pl{display:block;font-family:var(--body);font-style:italic;font-size:13px;color:var(--on-board-muted)}
.roster select{width:auto;min-width:130px;font-size:14px;padding:6px 8px}
.muted{color:var(--on-board-muted);font-style:italic;font-size:14px}
.replist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.replist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--board-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.replist .who{font-family:var(--display)} .replist .who em{font-family:var(--body);color:var(--on-board-muted);font-size:14px}
.replist .eff{color:var(--on-board-muted);font-size:15px;min-width:0}
@media (max-width:620px){.replist li{grid-template-columns:1fr}}
.rep a,.reg a{color:var(--gold)}
.office.regl{border-color:var(--gold)}
.scaleform{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:56px minmax(140px,1fr) 110px minmax(0,3fr);gap:10px;align-items:end}
.srow label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-board-muted)}
.srow .rn{text-align:center;align-self:center}
@media (max-width:620px){.srow{grid-template-columns:1fr}}
.inline.dark label{color:var(--on-board-muted)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* firebase additions */
header .pill{margin-left:auto}
.pill{font-family:var(--body);font-size:14px;color:var(--on-board-muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:normal;max-width:100%}
.pill.good{color:#8fd1a3}.pill.warn{color:#e8c46a}.pill.bad{color:#f0a79e;border-color:#6b2a24}
.stamps{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.stamp.st-archivee{color:var(--done)}
.stamp.st-super{color:#b33a1c;transform:rotate(-2deg)}
.note.super{box-shadow:0 0 0 3px #e0572a,0 10px 24px rgba(0,0,0,.45)}
.superline{margin:0;font-style:italic;color:#9b2c22;font-weight:600}
.riskline{margin:0;font-style:italic;color:#8a5b12}
.rm.ok{color:var(--open)}
.mini{font-family:var(--body);font-size:14px;background:transparent;border:1px solid #b9a982;border-radius:999px;color:var(--danger);padding:2px 10px;min-height:28px;cursor:pointer;margin-left:4px}
.name.st-refusee{text-decoration:line-through;opacity:.7}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.inline label{flex:1 1 180px;display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.filebtn{position:relative;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.form .check{flex-direction:row;align-items:center;gap:8px;align-self:end;min-height:40px}
.form .check input{width:auto}
.toast.err{color:var(--danger)}
.dmbar.import{border-color:var(--gold)}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
ui.showPnj=!!store("rdv-showpnj");
function parsePlayers(s){const n=String(s||"").match(/\d+/g);if(!n)return {min:null,max:null};const a=n.map(Number);return {min:a[0],max:a.length>1?a[a.length-1]:(/\+/.test(s)?null:a[0])};}
function normQuest(q){
  const out={};QUEST_KEYS.forEach(k=>{if(q[k]!==undefined)out[k]=q[k];});
  ["type","lieu","recompense","niveau","joueurs","date","description","maj"].forEach(k=>{out[k]=String(out[k]==null?"":out[k]);});
  if(out.joueursMin===undefined||out.joueursMax===undefined){const p=parsePlayers(out.joueurs);if(out.joueursMin===undefined)out.joueursMin=p.min;if(out.joueursMax===undefined)out.joueursMax=p.max;}
  ["joueursMin","joueursMax"].forEach(k=>{const v=out[k];out[k]=(v===""||v==null||isNaN(+v))?null:Math.max(0,Math.min(99,Math.round(+v)));});
  out.supercharged=!!out.supercharged;
  if(!RANKS[out.rang])out.rang="inconnu";
  if(!STATUS[out.statut])out.statut="ouverte";
  return out;
}
function office(id){return bureaux.filter(b=>b.id===id)[0];}
function questById(id){return quetes.filter(q=>q.id===id)[0];}
function myConfirmed(q){return !!(user&&!user.isAnonymous&&signupsFor(q.id).some(s=>s.uid===user.uid&&s.statut==="confirmee"));}
function reportBox(q){
  if((q.statut!=="encours"&&q.statut!=="terminee")||ui.dm||!myConfirmed(q))return "";
  const grp=signupsFor(q.id).filter(s=>s.statut==="confirmee"&&s.uid&&s.uid!=="dm"&&s.id===q.id+"__"+s.uid),w=grp.find(s=>s.uid===q.redacteur);
  let h='<div class="repbox"><p><strong>📜 Rapport de mission :</strong> '+(q.rapportBrouillon&&q.rapportBrouillon.resume?'envoyé au DM par '+esc(q.rapportBrouillon.auteur||"le groupe")+' ✓':w?'rédigé par <strong>'+esc(w.nom)+'</strong>'+(w.uid===user.uid?' (toi !)':''):'personne n\'est encore désigné. Choisissez qui l\'écrira.')+'</p>';
  if(!(q.rapportBrouillon&&q.rapportBrouillon.resume))h+='<div class="repsel"><label for="rw-'+esc(q.id)+'">Rédacteur<select id="rw-'+esc(q.id)+'">'+grp.map(s=>'<option value="'+esc(s.uid)+'"'+(s.uid===(q.redacteur||user.uid)?' selected':'')+'>'+esc(s.nom)+(s.uid===user.uid?' (moi)':'')+'</option>').join("")+'</select></label><button class="btn ghost" data-a="report-assign" data-id="'+esc(q.id)+'">'+(w?'Changer':'Désigner')+'</button></div>';
  return h+'</div>';
}
function signupsFor(id){return inscriptions.filter(s=>s.quete===id).sort((a,b)=>(a.creeMs||0)-(b.creeMs||0));}
function openCount(id){return quetes.filter(q=>q.bureau===id&&q.statut==="ouverte").length;}
function charge(q){
  const s=signupsFor(q.id), conf=s.filter(x=>x.statut==="confirmee").length, pend=s.filter(x=>x.statut==="attente").length;
  const max=q.joueursMax;
  if(q.supercharged||(max!=null&&conf>max))return {level:"super",conf,pend,max};
  if(max!=null&&conf+pend>max)return {level:"risque",conf,pend,max};
  return {level:"",conf,pend,max};
}
function rankSeal(r){const k=RANKS[r]||RANKS.inconnu;return '<span class="seal"><i style="background:'+k.c+'"></i>'+esc(k.label)+'</span>';}
function rose(size,center){
  const s=size/104;let h='<g transform="scale('+s+')">';
  [45,135,225,315].forEach(a=>{h+='<polygon transform="rotate('+a+')" points="0,-62 -9,-9 0,0 9,-9" fill="#d8b45e" opacity=".75"></polygon>';});
  [0,90,180,270].forEach(a=>{h+='<g transform="rotate('+a+')"><polygon points="0,-104 -15,-15 0,0" fill="#d8b45e"></polygon><polygon points="0,-104 15,-15 0,0" fill="#f6ecd0"></polygon></g>';});
  return h+'<circle r="9" fill="'+center+'" stroke="#d8b45e" stroke-width="4"></circle></g>';
}
function errText(e){
  const c=(e&&e.code)||"";
  if(c.indexOf("permission-denied")>=0)return "Action refusée par les règles de sécurité.";
  if(c.indexOf("unavailable")>=0)return "Connexion perdue. Réessaie dans un instant.";
  if(c.indexOf("popup-closed")>=0||c.indexOf("cancelled-popup")>=0)return "Connexion annulée.";
  if(c.indexOf("unauthorized-domain")>=0)return "Ce site n'est pas autorisé dans Firebase (domaines autorisés).";
  if(c.indexOf("operation-not-allowed")>=0)return "Ce mode de connexion n'est pas activé dans Firebase.";
  return (e&&e.message)?e.message:"Erreur inconnue.";
}
async function run(label, fn){

/* ---------- auth ---------- */
onAuthStateChanged(auth, async u=>{
  user=u;isAdmin=false;adminChecked=false;
  if(u&&!u.isAnonymous){
    try{const a=await getDoc(doc(db,"admins",u.uid));isAdmin=a.exists();}catch(e){isAdmin=false;}
    adminChecked=true;
    listenPrivate(isAdmin);
    if(isAdmin){ui.dm=true;ui.authMsg="";}
    else if(ui.loginIntent==="dm")ui.authMsg='Ce compte Google n\'est pas administrateur. Pour l\'ajouter, crée dans Firestore le document admins/'+u.uid+'.';
    if(!isAdmin){let asked=false;try{asked=sessionStorage.getItem("rdv-prompt-"+u.uid)==="1";}catch(e){}if(!asked)ui.promptSheet=true;}
    if(ui.needLogin&&!isAdmin){ui.signup=ui.needLogin;ui.promptSheet=false;}
    ui.needLogin=null;ui.loginIntent=null;
  }
  if(!isAdmin){ui.dm=false;listenPrivate(false);}
  render();
});
getRedirectResult(auth).catch(e=>{ui.authMsg=errText(e);render();});

/* ---------- planification (outil facultatif) ---------- */
const DISPO=["oui","peut","non"],DISPO_SYM={oui:"✓",peut:"?",non:"✗"},DISPO_LBL={oui:"Disponible",peut:"Peut-être",non:"Pas disponible"};
function todayIso(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function planDates(qid){const t=todayIso();return planifs.filter(p=>p.quete===qid&&p.date>=t).sort((a,b)=>(a.date+(a.heure||"")).localeCompare(b.date+(b.heure||"")));}
function fmtPlan(p){const d=new Date(p.date+"T12:00:00");return d.toLocaleDateString("fr-CA",{weekday:"short",day:"numeric",month:"short"})+(p.heure?", "+p.heure:"");}
function planRows(q){const seen={};return signupsFor(q.id).filter(s=>s.statut!=="refusee"&&s.uid&&s.uid.indexOf("dm-")!==0&&!seen[s.uid]&&(seen[s.uid]=1));}
function planScore(p,rows){let n=0;rows.forEach(r=>{const v=(p.dispo||{})[r.uid];if(v==="oui")n+=1;else if(v==="peut")n+=0.5;});return n;}
function planBest(q){const rows=planRows(q);let best=null,bs=0;planDates(q.id).forEach(p=>{if(p.dm==="non")return;const sc=planScore(p,rows);if(sc>bs){bs=sc;best=p;}});return best;}
function canPlan(q){return q.statut==="ouverte"&&(ui.dm||!!(user&&!user.isAnonymous&&signupsFor(q.id).some(s=>s.uid===user.uid&&s.statut!=="refusee")));}
function planLine(q){
  if(q.statut!=="ouverte")return "";const ds=planDates(q.id);if(!ds.length&&!canPlan(q))return "";
  const best=planBest(q),rows=planRows(q);
  const yes=best?rows.filter(r=>(best.dispo||{})[r.uid]==="oui").length:0;
  return '<p class="planline"><button class="mini plan" data-a="plan" data-id="'+esc(q.id)+'">📅 Planification</button>'+
    (best?'<span>Meilleure date : <strong>'+esc(fmtPlan(best))+'</strong> ('+yes+'/'+rows.length+')</span>':ds.length?'<span>'+ds.length+' date'+(ds.length>1?'s':'')+' proposée'+(ds.length>1?'s':'')+'</span>':'<span class="muted">Facultatif : proposez des dates</span>')+'</p>';
}
function planModal(q){
  const ds=planDates(q.id),rows=planRows(q),best=planBest(q),me=user&&user.uid,open=canPlan(q);
  const cell=(p,uid,isDm)=>{const v=isDm?p.dm:(p.dispo||{})[uid];const mine=open&&(isDm?ui.dm:uid===me);
    const sym=v?DISPO_SYM[v]:"·",lbl=v?DISPO_LBL[v]:"Pas de réponse";
    return '<td class="pc '+(v?'v-'+v:'v-none')+'">'+(mine?'<button class="pbtn" data-a="plan-set" data-id="'+esc(p.id)+'" data-dm="'+(isDm?1:0)+'" aria-label="'+esc(fmtPlan(p))+' : '+lbl+'. Changer" title="'+lbl+'">'+sym+'</button>':'<span title="'+lbl+'" aria-label="'+lbl+'">'+sym+'</span>')+'</td>';};
  let h='<div class="modal-bg" data-a="plan-close"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="pl-t"><h2 id="pl-t">Planification : « '+esc(q.titre)+' »</h2>'+

  if(!ds.length)h+='<p class="empty">Aucune date proposée pour l\'instant.</p>';
  else{
    h+='<div class="tablewrap"><table class="plantable"><thead><tr><th scope="col">Aventurier</th>'+ds.map(p=>{const del=open&&(ui.dm||(p.par&&p.par.uid===me));
      return '<th scope="col" class="'+(best&&best.id===p.id?'best':'')+(p.dm==="non"?' dmno':'')+'">'+esc(fmtPlan(p))+(best&&best.id===p.id?'<span class="tag">Meilleure</span>':'')+(p.dm==="non"?'<span class="tag">DM pas libre</span>':'')+(del?'<button class="rm" data-a="plan-del" data-id="'+esc(p.id)+'" aria-label="Retirer la date '+esc(fmtPlan(p))+'" title="Retirer cette date">✕</button>':'')+'</th>';}).join("")+'</tr></thead><tbody>';
    h+='<tr class="dmrow"><th scope="row">Le DM</th>'+ds.map(p=>cell(p,null,true)).join("")+'</tr>';
    h+=rows.slice().sort((x,y)=>(y.uid===me)-(x.uid===me)).map(r=>'<tr'+(r.uid===me?' class="merow"':'')+'><th scope="row">'+esc(r.nom)+(r.uid===me?' <em>(toi)</em>':'')+'</th>'+ds.map(p=>cell(p,r.uid,false)).join("")+'</tr>').join("");
    h+='<tr class="tot"><th scope="row">Total</th>'+ds.map(p=>{const y=rows.filter(r=>(p.dispo||{})[r.uid]==="oui").length,m=rows.filter(r=>(p.dispo||{})[r.uid]==="peut").length;return '<td>'+y+' ✓'+(m?' · '+m+' ?':'')+'</td>';}).join("")+'</tr></tbody></table></div>';
  }
  if(open&&ds.length<6)h+='<form class="inline planadd" id="planform"><label for="pl-date">Proposer une date<input id="pl-date" type="date" required min="'+todayIso()+'"></label><label for="pl-heure">Heure (facultatif)<input id="pl-heure" maxlength="30" placeholder="ex. 19 h"></label><button class="btn" type="submit">Proposer</button></form>';
  else if(!open)h+='<p class="hint">'+(user&&!user.isAnonymous?'Inscris-toi à la quête pour proposer des dates et répondre.':'Connecte-toi et inscris-toi à la quête pour participer.')+'</p>';
  return h+'<div class="actions"><button class="btn ghost" type="button" data-a="plan-close">Fermer</button></div></div></div>';
}

  bt.set(doc(db,"points",a.id),{parRegion:{[bid]:r1},notoriete:{[bid]:n1}},{merge:true});
  pointsMap[a.id]=Object.assign({},pointsMap[a.id]||{},{[bid]:r1});notoMap[a.id]=Object.assign({},notoMap[a.id]||{},{[bid]:n1});

function resizeImage(file,maxSize){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=()=>rej(new Error("Lecture impossible"));
    r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("Image illisible"));im.onload=()=>{
      const max=maxSize||360,sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.82));};im.src=r.result;};
    r.readAsDataURL(file);
  });
}

const NOTE_CATS = ["Intrigues","PNJ","Secrets","Idées de quêtes","Factions","Lieux"];
const RANK_ORDER = ["cuivre","fer","argent","or","mithral"];
function nextRank(r){const i=RANK_ORDER.indexOf(r);return i<0?"cuivre":RANK_ORDER[Math.min(i+1,RANK_ORDER.length-1)];}
function seuilMonde(){const v=monde&&monde.seuil;return typeof v==="number"&&v>0?v:3;}
function doneIn(bid){return quetes.filter(q=>q.bureau===bid&&q.rapport&&(q.statut==="terminee"||q.statut==="archivee"));}
function pendingIn(bid){const r=(monde&&monde.regions&&monde.regions[bid])||{},vues=r.vues||[];return doneIn(bid).filter(q=>vues.indexOf(q.id)<0);}
function dueRegions(){return bureaux.filter(b=>pendingIn(b.id).length>=seuilMonde());}
function newsFor(bid){return nouvelles.filter(n=>!bid||n.region===bid||(bid&&n.region==="cote")).sort((a,b)=>tms(b.date)-tms(a.date));}
function tms(t){return t&&t.toMillis?t.toMillis():0;}
function newsChars(n){const l=(n.aventuriers||[]).map(id=>aventuriers.find(a=>a.id===id)).filter(Boolean);
  return l.length?'<p class="nchars">'+l.map(a=>'<a class="nchar" href="#perso-'+esc(a.id)+'">'+(a.image?'<img src="'+esc(a.image)+'" alt="">':'')+esc(a.nom)+'</a>').join("")+'</p>':'';}

async function reveal(kind,id){
  const x=kind==="factions"?factions.find(y=>y.id===id):kind==="pnj"?pnjs.find(y=>y.id===id):kind==="monstres"?monstres.find(y=>y.id===id):notesDm.find(y=>y.id===id);if(!x)return;
  const cid="rev-"+id,ex=revealedEntry(id),by={uid:user.uid,nom:"Le DM"};
  const titre=String(kind==="pages"?x.titre:x.nom).slice(0,100),region=kind==="factions"?"cote":(x.region||"cote"),image=x.image||"";
  await run("Révélé aux joueurs",async()=>{
    if(ex){await setDoc(doc(db,"compendium",cid),kind==="factions"?{titre,image,majLe:serverTimestamp()}:{titre,region,image,majLe:serverTimestamp()},{merge:true});return;}
    const categorie=(kind==="factions"?"Factions":kind==="pnj"?"PNJ":kind==="monstres"?"Créatures":(x.categorie||"Lieux")).slice(0,40);
    const contenu=kind==="factions"?"## Régions d'influence\n*À découvrir…*\n\n## Membres connus\n*À découvrir…*\n\n## Ce qu'on en dit\n*À découvrir…*":kind==="pnj"?(x.lieu?"**Où le trouver :** "+x.lieu:""):kind==="monstres"?(x.type?"*"+x.type+"*":""):"";
    const q=kind==="pnj"?(x.quetes||[]).map(questById).find(q=>q&&q.statut!=="ouverte"):null;
    const f={titre,categorie,region,contenu:String(contenu).slice(0,20000),image,quete:q?q.id:""};
    const bt=writeBatch(db);
    bt.set(doc(db,"compendium",cid),Object.assign({},f,{publiee:true,masque:false,proposition:null,creePar:by,modifiePar:by,creeLe:serverTimestamp(),majLe:serverTimestamp()}));
    bt.set(doc(collection(db,"compendium",cid,"versions")),Object.assign({},f,{par:by,approbateurs:{},parDM:true,date:serverTimestamp()}));
    await bt.commit();
  });
}

function genEncounter(){const G=ui.gen,bi={faible:0,moderee:1,elevee:2}[G.diff],budget=budgets()[bi],floor=bi>0?budgets()[bi-1]:Math.round(budget*0.5);

/* ---------- Atelier des portraits : prompts pour ChatGPT + collage d'images ---------- */
const ART_STYLE="Style : illustration officielle d'un manuel de Donjons & Dragons. Peinture numérique réaliste et très détaillée, proportions réalistes (pas de dessin animé ni de manga), textures riches (tissus, cuir, métal), lumière chaude et douce venant du haut à gauche. Fond de parchemin TRÈS CLAIR (beige pâle) uni, légèrement taché, avec un vignettage doux ; aucun décor. Sujet seul, centré, représenté EN PIED de la tête aux pieds, légère contre-plongée, pose naturelle et expressive, petite ombre douce au sol. Format vertical 4:5. Aucun texte, aucune signature, aucun cadre, aucun logo.";
const ART_INSTR="Tu es l'illustrateur du manuel de la « Grande Guilde de la Rose des Vents », une campagne de Donjons & Dragons 5e édition (règles 2024) qui se déroule sur la Sword Coast, dans les Royaumes oubliés.\n\nÀ chaque message, je te donne une fiche (PNJ, créature, lieu ou faction). Tu génères UNE seule image qui respecte toujours exactement ce style, pour que toutes les images aient l'air de sortir du même livre :\n\n"+ART_STYLE+"\n\nRègles :\n- Garde la même esthétique que l'image de référence (le portrait de Pax, le giff en manteau rouge qui tient une tasse de café) : même rendu peint, même fond de parchemin, même lumière, même cadrage en pied.\n- Crée toujours des designs originaux : ne reproduis jamais une illustration officielle existante ni un personnage connu.\n- Respecte la description (espèce, âge, vêtements, accessoires). Si un détail manque, invente-le de façon cohérente avec le rôle du personnage et la Sword Coast.\n- Les « Outerworlders » sont des gens de notre monde arrivés SANS RIEN dans ce monde de fantasy. Ils vivent en appliquant ce qu'ils connaissent de la vie moderne, mais avec des moyens et des matériaux médiévaux : leurs vêtements et leurs objets peuvent s'inspirer du monde moderne (coupe, idée, usage), mais ils sont toujours fabriqués à la main en bois, cuir, tissu, fer forgé, laiton ou verre soufflé. Jamais de plastique, d'électronique, de logo ni de vraie technologie moderne.\n- Les naines n'ont PAS de barbe, sauf si la fiche le précise explicitement.\n- La rose des vents (étoile à 8 branches) est l'emblème de la Guilde : ne la mets JAMAIS sur un personnage, sauf si sa fiche dit qu'il porte l'emblème de la Guilde. N'ajoute aucun autre symbole, blason ou emblème inventé : seulement ceux décrits dans la fiche. Le portrait de Pax sert uniquement de référence de style (rendu, fond, lumière, cadrage), pas de costume.\n- Varie les poses d'une image à l'autre : orientation du corps (de face, de trois quarts à gauche ou à droite, de profil), direction du regard, gestes, appui et attitude propres au personnage. Évite que tous les personnages se tiennent dans la même pose. Varie aussi les palettes de couleurs selon le rôle et la faction, sans jamais t'écarter de la description.\n- Pour une créature : même fond et même rendu, créature entière, pose menaçante ou naturelle, sans personnage autour.\n- Pour un lieu ou une faction : une illustration en vignette sur le même fond de parchemin (un emblème, un bâtiment ou une scène), sans texte.\n- Ne me pose pas de questions : génère directement l'image.";
const ATT_PROMPT={amical:"bienveillant et accueillant",neutre:"neutre, réservé",mefiant:"méfiant, sur ses gardes",hostile:"menaçant, hostile",inconnu:"énigmatique"};

function ptRoll(expr){

function csqParse(t){return String(t||"").split(/\n+/).map(l=>l.replace(/^\s*[-*•]\s*/,"").trim()).filter(Boolean).map((l,i)=>{const m=l.match(/^([^:]{2,40}):\s*(.+)$/);let q=null,txt=l;
  if(m){const ks=m[1].split(/,|\/| et /).map(x=>CSQ_K[x.trim().toLowerCase()]);if(ks.length&&ks.every(Boolean)){txt=m[2];q=ks.indexOf("*")>=0?null:ks;}}return {i:i,txt:txt,q:q};});}
// Objectifs : une ligne par objectif « Objectif | conséquence si raté » ; les lignes « - … » en dessous sont des éléments à cocher (« ×2 » = deux cases).
function objParse(t){const out=[];String(t||"").split(/\n+/).forEach(raw=>{const l=raw.trim();if(!l)return;
    const sub=/^[-*•]\s+/.test(l);if(sub&&out.length){const x=l.replace(/^[-*•]\s+/,""),m=x.match(/^(.*?)\s*[×x]\s*(\d{1,2})$/),o=out[out.length-1];
      if(m&&+m[2]>1)for(let n=1;n<=+m[2];n++)o.sub.push(m[1].trim()+" "+n);else o.sub.push(m?m[1].trim():x);return;}
    const k=l.indexOf("|"),y=l.replace(/^[-*•]\s+/,"");const kk=y.indexOf("|");out.push({i:out.length,txt:(kk>=0?y.slice(0,kk):y).trim(),csq:(kk>=0?y.slice(kk+1):"").trim(),sub:[]});});
  return out;}
function objsOf(q){return objParse((scenarios[q.id]||{}).objectifs);}
function objResult(n,tot){return !tot?null:n>=tot?"reussite":n>0?"partielle":"echec";}
function ptObjDone(q){const d=(ui.pt&&ui.pt.id===q.id)?ui.pt:parties.find(p=>p.id===q.id);return (d&&d.objectifs)||[];}
function csqTags(c){return c.q?c.q.map(k=>'<span class="csqt t-'+k+'">'+CSQ_L[k]+'</span>').join(""):'<span class="csqt">Tous</span>';}
function csqList(q){const l=csqParse((scenarios[q.id]||{}).consequences);return l.length?'<ul class="csql">'+l.map(c=>'<li>'+csqTags(c)+' '+esc(c.txt)+'</li>').join("")+'</ul>':'';}
// Conséquences retenues au bilan (privé : dans le scénario)
function csqKept(q){const m=(scenarios[q.id]||{}).monde;if(!m||!((m.liste||[]).length||m.autre))return "";
  return '<div class="csqkept"><h4>Conséquences retenues ('+esc((RESULTS[m.resultat]||"").toLowerCase())+')</h4><ul>'+(m.liste||[]).map(t=>'<li>'+esc(t)+'</li>').join("")+(m.autre?'<li><em>'+esc(m.autre)+'</em></li>':'')+'</ul></div>';}
// Conséquences retenues à suivre : une ligne par conséquence, avec son état (à suivre, rumeur/quête créée, réglée).
function csqItems(q){const m=(scenarios[q.id]||{}).monde;if(!m)return [];const su=m.suites||{};
  return (m.liste||[]).concat(m.autre?[m.autre]:[]).map((t,k)=>({q:q,k:k,txt:t,suite:su[k]||null}));}
function csqAll(){return quetes.filter(q=>q.statut==="terminee"||q.statut==="archivee").flatMap(csqItems);}
function evoProps(){const P=(evoPriv&&evoPriv.propositions)||{};return Object.keys(P).map(k=>Object.assign({pid:k},P[k]));}

    (p.pourquoi?'<p class="desc"><strong>Pourquoi :</strong> '+esc(p.pourquoi)+'</p>':'')+
    ((p.sources||[]).length?'<p class="desc"><strong>Conséquences intégrées :</strong> '+(p.sources||[]).map(r=>{const q=questById(r.q),x=q&&csqItems(q)[+r.k];return x?esc(x.txt):"";}).filter(Boolean).join(" · ")+'</p>':'')+

    '<div class="actions">'+(ui.evoDel===p.pid?'<button class="btn danger sm" data-a="evo-rej-yes" data-id="'+esc(p.pid)+'">Confirmer le rejet</button><button class="btn ghost sm" data-a="evo-rej-no">Annuler</button>':'<button class="btn gold sm" data-a="evo-pub" data-id="'+esc(p.pid)+'">Publier au tableau</button><button class="btn ghost sm" data-a="evo-rej" data-id="'+esc(p.pid)+'">Rejeter</button>')+'</div></article>';}
function csqSection(){const all=csqAll(),todo=all.filter(x=>!x.suite),done=all.filter(x=>x.suite);if(!all.length)return "";

    (todo.length?byReg(todo):'<p class="desc">Tout est suivi. Le monde est à jour.</p>')+(done.length?'<details class="csqbox"><summary>Déjà suivies ('+done.length+')</summary>'+byReg(done)+'</details>':'')+'</section>';}
function csqText(q){const m=(scenarios[q.id]||{}).monde;if(!m)return "";return ((m.liste||[]).concat(m.autre?[m.autre]:[])).map(t=>"- "+q.titre+" : "+t).join("\n");}
function ptObjectifs(q){const ob=objsOf(q),P=ui.pt,od=P.objectifs||[],sd=P.objSub||{};
  return '<p class="desc">Secrets : les joueurs ne les voient pas. Ils déterminent le résultat en fin de quête (tous = Réussite, certains = Réussite partielle, aucun = Échec).</p>'+ob.map(o=>{const on=od.indexOf(o.i)>=0,ss=sd[o.i]||[];
    return '<section class="ptobj'+(on?' done':'')+'"><label class="ptobjrow" for="pobj-'+o.i+'"><input type="checkbox" class="pt-obj" id="pobj-'+o.i+'" data-i="'+o.i+'"'+(on?' checked':'')+'><span><strong>'+esc(o.txt)+'</strong>'+(o.sub.length?' <span class="desc">('+ss.filter(k=>k<o.sub.length).length+' / '+o.sub.length+')</span>':'')+'</span></label>'+
      (o.sub.length?'<ul class="objsub">'+o.sub.map((x,k)=>'<li><label for="psub-'+o.i+'-'+k+'"><input type="checkbox" class="pt-osub" id="psub-'+o.i+'-'+k+'" data-i="'+o.i+'" data-k="'+k+'"'+(ss.indexOf(k)>=0?' checked':'')+'><span>'+esc(x)+'</span></label></li>').join("")+'</ul>':'')+'</section>';}).join("");}
function ptScenario(q){
  const s=scenarios[q.id]||{},txt=String(s.scenario||""),P=ui.pt,faits=P.faits||[],encs=ptEncounters(q),used={};
  const parts=txt.split(/\n(?=##\s)/);let h='';
  const encBtn=r=>'<button class="btn gold sm" data-a="pt-launch" data-id="'+esc(r.id)+'">⚔ Lancer le combat : '+esc(r.nom)+'</button>';
  parts.forEach((sec,i)=>{const isH=/^##\s/.test(sec);const here=encs.filter(r=>sec.indexOf(r.nom)>=0);here.forEach(r=>{used[r.id]=1;});
    if(!isH){if(sec.trim())h+='<div class="wikibody">'+md(manLinks(sec))+'</div>'+(here.length?'<p class="ptlaunch">'+here.map(encBtn).join("")+'</p>':'');return;}
    const done=faits.indexOf(i)>=0;
    h+='<section class="ptsec'+(done?' done':'')+'"><label class="ptsecchk"><input type="checkbox" class="pt-sec" data-i="'+i+'"'+(done?' checked':'')+'><span class="sr">Marquer cette étape comme faite</span></label><div class="wikibody">'+md(manLinks(sec))+'</div>'+(here.length?'<p class="ptlaunch">'+here.map(encBtn).join("")+'</p>':'')+'</section>';});
  const rest=encs.filter(r=>!used[r.id]);

function download(name,text){
  const blob=new Blob([text],{type:"application/json"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportJSON(){
  const data={format:"rose-des-vents",version:1,exporteLe:new Date().toISOString(),
    bureaux:bureaux.map(b=>Object.assign({},b)),
    quetes:quetes.map(q=>Object.assign({id:q.id},normQuest(q))),
    inscriptions:inscriptions.map(s=>({id:s.id,quete:s.quete,uid:s.uid,nom:s.nom,statut:s.statut,creeLe:new Date(s.creeMs).toISOString()}))};
  download("rose-des-vents-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(data,null,2));
}
function previewImport(obj){
  const list=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.quetes)?obj.quetes:null);
  if(!list)throw new Error("Le fichier doit contenir une liste « quetes ».");
  const del=(obj&&Array.isArray(obj.supprimer)?obj.supprimer:[]).filter(id=>questById(id));
  const add=[],upd=[],bad=[];let same=0;
  list.forEach(raw=>{
    if(!raw||!raw.titre||!office(raw.bureau)){bad.push(raw);return;}
    const id=String(raw.id||("q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6))).replace(/[^A-Za-z0-9_-]/g,"").slice(0,60);
    const q=normQuest(raw),cur=questById(id);
    if(!cur)add.push({id,q});
    else if(JSON.stringify(normQuest(cur))!==JSON.stringify(q))upd.push({id,q});
    else same++;
  });
  return {add,upd,del,same,bad};
}
async function applyImport(){
  const p=ui.importPreview;if(!p)return;
  await run("Import",async()=>{
    const ops=[];
    p.add.forEach(x=>ops.push(bt=>bt.set(doc(db,"quetes",x.id),Object.assign({},x.q,{creeLe:serverTimestamp(),majLe:serverTimestamp()}))));
    p.upd.forEach(x=>ops.push(bt=>bt.set(doc(db,"quetes",x.id),Object.assign({},x.q,{majLe:serverTimestamp()}),{merge:true})));
    p.del.forEach(id=>{ops.push(bt=>bt.delete(doc(db,"quetes",id)));signupsFor(id).forEach(s=>ops.push(bt=>bt.delete(doc(db,"inscriptions",s.id))));});
    for(let i=0;i<ops.length;i+=400){const bt=writeBatch(db);ops.slice(i,i+400).forEach(f=>f(bt));await bt.commit();}
  });
  ui.importPreview=null;render();
}
async function migrate(){
  const miss=seedMissing();
  await run("Migration",async()=>{
    const bt=writeBatch(db);
    miss.b.forEach((b,i)=>{const d={nom:b.nom,x:b.x,y:b.y,ordre:SEED.bureaux.findIndex(x=>x.id===b.id)};if(b.siege)d.siege=true;bt.set(doc(db,"bureaux",b.id),d);});
    await bt.commit();
    const bt2=writeBatch(db);
    miss.q.forEach(q=>{bt2.set(doc(db,"quetes",q.id),Object.assign(normQuest(q),{creeLe:serverTimestamp(),majLe:serverTimestamp()}));});
    await bt2.commit();
    const bt3=writeBatch(db);let n=0;
    miss.q.forEach(q=>(q.inscrits||[]).forEach((nom,i)=>{n++;bt3.set(doc(db,"inscriptions",q.id+"__dm-mig"+i),{quete:q.id,uid:"dm",nom:String(nom).slice(0,40),statut:"confirmee",creeLe:serverTimestamp()});}));
    if(n)await bt3.commit();
  });

function csqPick(q,C){const win=csqWin(q),all=csqParse((scenarios[q.id]||{}).consequences).filter(c=>win.indexOf(c)<0&&!win.some(w=>w.i===c.i)),res=C.rapport.resultat,sel=C.csq||[];

    const all=csqParse((scenarios[C.id]||{}).consequences);C.csq=Array.from(document.querySelectorAll('#completeform input[data-csq]')).filter(c=>c.checked).map(c=>(all[+c.getAttribute("data-csq")]||{}).txt).filter(Boolean);

}

function compBy(){return {uid:user.uid,nom:String(user.displayName||user.email||"Aventurier").slice(0,60)};}
function compFields(d){return {titre:d.titre,categorie:d.categorie,region:d.region,contenu:d.contenu||"",image:d.image||"",quete:d.quete||""};}
// Joueur : la sauvegarde devient une proposition en revue. DM : publication directe.
async function saveComp(id,data,isNew){
  const by=compBy(),ref=doc(db,"compendium",id),f=compFields(data);
  return run("Compendium",async()=>{
    if(ui.dm){
      const bt=writeBatch(db);
      if(isNew)bt.set(ref,Object.assign({},f,{publiee:true,masque:false,proposition:null,creePar:by,modifiePar:by,creeLe:serverTimestamp(),majLe:serverTimestamp()}));
      else bt.set(ref,Object.assign({},f,{publiee:true,proposition:null,modifiePar:by,majLe:serverTimestamp()}),{merge:true});
      bt.set(doc(collection(db,"compendium",id,"versions")),Object.assign({},f,{par:by,approbateurs:{},date:serverTimestamp()}));
      await bt.commit();return;
    }
    const prop=Object.assign({},f,{par:by,approbations:{},date:serverTimestamp()});
    if(isNew)await setDoc(ref,Object.assign({},f,{publiee:false,masque:false,proposition:prop,creePar:by,creeLe:serverTimestamp()}));
    else await updateDoc(ref,{proposition:prop});
  });
}
// Approbation : la 2e approbation (ou le DM) publie la proposition et l'inscrit dans l'historique.
async function approveComp(e,force){
  const by=compBy(),p=e.proposition,ref=doc(db,"compendium",e.id);
  const appr=Object.assign({},p.approbations||{});if(!force)appr[by.uid]=by.nom;
  const done=force||Object.keys(appr).length>=2;
  return run(done?"Publication":"Approbation",async()=>{
    if(!done){await updateDoc(ref,{["proposition.approbations."+by.uid]:by.nom});return;}
    const f=compFields(p),bt=writeBatch(db);
    bt.update(ref,Object.assign({},f,{publiee:true,proposition:null,modifiePar:p.par,majLe:serverTimestamp()}));
    bt.set(doc(collection(db,"compendium",e.id,"versions")),Object.assign({},f,{par:p.par,approbateurs:appr,date:serverTimestamp()},force?{parDM:true}:{}));
    await bt.commit();
  });
}

      bt.set(doc(collection(db,"evolutions")),{region:bid,date:serverTimestamp(),quetes:pend,notes,changements:changes.map(c=>({quete:c.quete,titre:c.titre,ancienRang:c.ancienRang,nouveauRang:c.nouveauRang,maj:c.maj})),nouvelle:nid,nouvelleTitre:nt});
      bt.set(doc(db,"prive","monde"),{regions:{[bid]:{vues:allDone}}},{merge:true});
      await bt.commit();
    });return;
  }
  if(e.target.id==="planform"){
    const q=questById(ui.plan);if(!q)return;const date=v("pl-date"),heure=v("pl-heure").slice(0,30);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<todayIso())return;
    if(planDates(q.id).some(p=>p.date===date&&(p.heure||"")===heure)){save={state:"error",msg:"Cette date est déjà proposée."};render();return;}
    const by={uid:user.uid,nom:String(ui.dm?"Le DM":((signupsFor(q.id).find(x=>x.uid===user.uid)||{}).nom||user.displayName||"Aventurier")).slice(0,60)};
    const ref=doc(collection(db,"planif"));const d={quete:q.id,date,heure,par:by,dispo:{},creeLe:serverTimestamp()};
    if(ui.dm)d.dm="oui";else d.dispo[user.uid]="oui";
    const f1=document.getElementById("pl-date");if(f1)f1.value="";const f2=document.getElementById("pl-heure");if(f2)f2.value="";
    await run("Date proposée",()=>setDoc(ref,d));return;
  }
  if(e.target.id==="groupform"){
    const q=questById(ui.confirmGroup);if(!q)return;
    const picks={};document.querySelectorAll("#groupform input[data-sid]").forEach(c=>{picks[c.getAttribute("data-sid")]=c.checked;});
    if(!Object.values(picks).some(Boolean)){save={state:"error",msg:"Coche au moins un aventurier."};render();return;}
    const date=v("g-date").slice(0,80);ui.confirmGroup=null;
    await run("Groupe confirmé",async()=>{
      const bt=writeBatch(db);
      signupsFor(q.id).filter(x=>x.statut!=="refusee").forEach(x=>{const st=picks[x.id]?"confirmee":"refusee";if(st!==x.statut)bt.set(doc(db,"inscriptions",x.id),Object.assign({quete:x.quete,uid:x.uid,nom:x.nom,statut:st,creeLe:x.creeLe||serverTimestamp(),majLe:serverTimestamp()},x.aventurier?{aventurier:x.aventurier}:{}));});
      bt.set(doc(db,"quetes",q.id),{statut:"encours",date,majLe:serverTimestamp()},{merge:true});
      await bt.commit();
    });return;
  }
  if(e.target.id==="reportform"){
    const q=questById(ui.reportWrite);if(!q)return;
    const texte=((document.getElementById("r-texte")||{}).value||"").trim().slice(0,4000);if(!texte)return;
    const auteur=(signupsFor(q.id).find(x=>x.uid===user.uid)||{}).nom||user.displayName||"un joueur";
    ui.reportWrite=null;
    await run("Rapport",()=>setDoc(doc(db,"quetes",q.id),{rapportBrouillon:{resume:texte,auteur:String(auteur).slice(0,60),majLe:serverTimestamp()},majLe:serverTimestamp()},{merge:true}));
    ui.signupMsg={id:q.id,text:"Rapport envoyé au DM. Merci !"};render();return;
  }
  if(e.target.id==="adjform"){
    const a=aventuriers.find(y=>y.id===v("j-adv")),bid=v("j-b"),n=Math.round(+v("j-pts")||0),nn=Math.round(+v("j-ptsn")||0),why=v("j-why").slice(0,200);if(!a||(!n&&!nn))return;
    ui.adjust=false;
    await run("Renommée",async()=>{const bt=writeBatch(db);addPoints(bt,a,bid,n,nn);bt.set(doc(collection(db,"journal")),{aventurier:a.id,nom:a.nom,bureau:bid,points:n,notoriete:nn,raison:why||"Ajustement du DM",date:serverTimestamp()});await bt.commit();});return;
  }
  if(e.target.id==="wikiform"){
    const titre=v("w-titre").slice(0,100),contenu=(document.getElementById("w-contenu")||{}).value||"",o=v("w-ordre");if(!titre)return;
    const isNew=ui.wikiEdit==="new";let id=isNew?wikiSlug(titre):ui.wikiEdit;
    if(isNew&&wikiPages.some(p=>p.id===id))id=(id+"-"+Date.now().toString(36).slice(-3)).slice(0,60);
    const data={titre,contenu:contenu.slice(0,50000),majLe:serverTimestamp()};if(o!=="")data.ordre=+o;
    ui.wikiEdit=null;ui.wikiPreview=false;
    const ok=await run("Wiki",()=>isNew?setDoc(doc(db,"wiki",id),Object.assign(data,{creeLe:serverTimestamp()})):setDoc(doc(db,"wiki",id),data,{merge:true}));
    if(ok&&isNew)location.hash="#"+id;return;
  }
  if(e.target.id==="scaleform"){
    const noto=NOTO_DEF.map(d=>({n:d.n,titre:v("sn-t"+d.n).slice(0,40)||d.titre,effet:v("sn-e"+d.n).slice(0,300)})),repu=REPU_DEF.map(d=>({r:d.r,titre:v("sr-t"+d.r).slice(0,40)||d.titre,effet:v("sr-e"+d.r).slice(0,300)}));
    const seuilsN={},seuilsR={};NOTO_DEF.forEach(d=>{const x=v("sn-s"+d.n);seuilsN[String(d.n)]=d.n===1?0:(x===""||isNaN(+x)?seuilN(d.n):Math.round(+x));});REPU_DEF.forEach(d=>{const x=v("sr-s"+d.r);seuilsR[String(d.r)]=d.r===5?0:(x===""||isNaN(+x)?seuilR(d.r):Math.round(+x));});
    const titres={};REPU_DEF.forEach(r=>NOTO_DEF.forEach(n=>{const c=r.r*10+n.n;titres[String(c)]=v("tt-"+c).slice(0,40);}));
    const num=(id,d,abs)=>{const x=v(id);return x===""||isNaN(+x)?d:(abs?Math.abs(+x):+x);};
    const mefaits={},mefaitsN={},bienNv={},bienRv={},bienLb={},mult={},res={};
    Object.keys(DEFAULT_MEFAITS).forEach(k=>{mefaits[k]=Math.round(num("mf-"+k,mefaitPts()[k],1));mefaitsN[k]=Math.round(num("mfn-"+k,mefaitN()[k],1));});
    BIENFAITS.forEach(k=>{bienNv[k]=Math.round(num("bn-"+k,bienN()[k],1));bienRv[k]=Math.round(num("br-"+k,bienR()[k],1));bienLb[k]=v("bl-"+k).slice(0,40)||BIENFAIT_LABELS[k];});
    ["cuivre","fer","argent","or","mithral"].forEach(k=>{mult[k]=num("mu-"+k,rankMult()[k],1);});
    Object.keys(RES_PTS).forEach(k=>{res[k]={n:Math.round(num("rs-n-"+k,resPts()[k].n)),r:Math.round(num("rs-r-"+k,resPts()[k].r))};});
    ui.scaleEdit=false;
    await run("Renommée",async()=>{const bt=writeBatch(db);bt.set(doc(db,"config","renommee"),{noto,repu,titres,bienLabels:bienLb,majLe:serverTimestamp()},{merge:true});bt.set(doc(db,"prive","renommee"),{seuilsN,seuilsR,mefaits,mefaitsN,bienN:bienNv,bienR:bienRv,mult,res},{merge:true});await bt.commit();
      priv=Object.assign({},priv||{},{seuilsN,seuilsR});
      const bt2=writeBatch(db);let k=0;aventuriers.forEach(a=>bureaux.forEach(b=>{if(typeof (pointsMap[a.id]||{})[b.id]!=="number"&&typeof (notoMap[a.id]||{})[b.id]!=="number")return;const nc=codeOf(ptsN(a,b.id),pts(a,b.id));if(nc!==renown(a,b.id)){k++;bt2.update(doc(db,"aventuriers",a.id),new FieldPath("niveaux",b.id),nc);}}));if(k)await bt2.commit();});return;
  }
  if(e.target.id==="nameform"){
    const qid=e.target.getAttribute("data-id"),name=v("f-addname").slice(0,40);if(!name)return;
    ui.addName=null;
    await run("Ajout",()=>setDoc(doc(db,"inscriptions",qid+"__dm-"+Date.now().toString(36)),{quete:qid,uid:"dm",nom:name,statut:"confirmee",creeLe:serverTimestamp()}));
    return;
  }
  if(e.target.id==="qform"){
    const isNew=ui.editing==="new";
    const id=isNew?("q"+Date.now().toString(36)):ui.editing;
    const sup=document.getElementById("f-super");
    const jmin=v("f-jmin"),jmax=v("f-jmax");
    const q=normQuest({bureau:v("f-bureau"),titre:v("f-titre")||"Quête sans titre",type:v("f-type"),rang:v("f-rang"),statut:v("f-statut"),lieu:v("f-lieu"),recompense:v("f-recompense"),niveau:v("f-niveau"),
      joueursMin:jmin===""?null:+jmin,joueursMax:jmax===""?null:+jmax,supercharged:!!(sup&&sup.checked),date:v("f-date"),description:v("f-desc"),maj:v("f-maj")});
    const ptsOverride=v("f-pts");
    if(q.joueursMin!=null&&q.joueursMax!=null&&q.joueursMin>q.joueursMax)q.joueursMin=q.joueursMax;
    q.joueurs=q.joueursMin!=null&&q.joueursMax!=null?(q.joueursMin===q.joueursMax?String(q.joueursMin):q.joueursMin+" à "+q.joueursMax):(q.joueursMin!=null?q.joueursMin+" et +":"?");
    const cur=isNew?null:questById(id);
    ui.editing=null;
    await run("Points",()=>setDoc(doc(db,"prive","renommee"),{quetes:{[id]:ptsOverride===""?null:Math.round(+ptsOverride)}},{merge:true}));
    const dref=isNew&&ui.questDraft&&ui.questDraft.csqRef;ui.questDraft=null;
    await run("Enregistrement",()=>cur?setDoc(doc(db,"quetes",id),Object.assign(q,{majLe:serverTimestamp()}),{merge:true}):setDoc(doc(db,"quetes",id),Object.assign(q,{creeLe:serverTimestamp(),majLe:serverTimestamp()})));
    if(dref)await run("Conséquence suivie",()=>setDoc(doc(db,"scenarios",dref.q),{monde:{suites:{[dref.k]:{quete:id,type:q.type==="Rumeur"?"rumeur":"quete"}}}},{merge:true}));
  }
});

document.addEventListener("paste",e=>{const z=document.activeElement&&document.activeElement.closest&&document.activeElement.closest("[data-paste]");if(!z)return;
  const it=Array.from((e.clipboardData&&e.clipboardData.items)||[]).find(i=>i.type&&i.type.indexOf("image/")===0);if(!it)return;e.preventDefault();artSave(z.getAttribute("data-paste"),it.getAsFile());});
document.addEventListener("dragover",e=>{if(e.target.closest&&e.target.closest("[data-paste]")){e.preventDefault();e.target.closest("[data-paste]").classList.add("over");}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("[data-paste]");if(z)z.classList.remove("over");});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("[data-paste]");if(!z)return;e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)artSave(z.getAttribute("data-paste"),f);});

/* ---------- start ---------- */
route();
render();
listen();
</script>
